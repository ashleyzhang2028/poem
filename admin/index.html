<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>管理后台 · 跬步</title>
  <meta name="description" content="跬步管理后台：账号名录与 Free / Pro / Max 层级、用户报告、注音勘误。全部以数据库为准。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/account.css" />
</head>
<body data-nav="admin" data-dock="off" data-back="/mine/" data-page="管理后台" data-sub="选择管理模块">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="admin-page">

      <section class="account-card" id="deny-card" hidden>
        <h2 class="account-card-title danger-title">没有权限</h2>
        <p class="account-lead" id="deny-lead"></p>
        <button class="account-btn ghost" id="btn-back-profile" type="button">返回</button>
      </section>

      <section class="account-card" id="grant-card" hidden>
        <h2 class="account-card-title">管理后台</h2>

        <div class="admin-nav-list">
          <a href="/admin/accounts.html" class="admin-nav-item">
            <div class="admin-nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
            </div>
            <div class="admin-nav-content">
              <h3 class="admin-nav-title">账号管理</h3>
              <p class="admin-nav-desc">修改用户角色和层级（Free / Pro / Max）</p>
            </div>
          </a>

          <a href="/admin/reports.html" class="admin-nav-item">
            <div class="admin-nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <div class="admin-nav-content">
              <h3 class="admin-nav-title">用户报告</h3>
              <p class="admin-nav-desc">查看和处理用户提交的报告</p>
            </div>
          </a>

          <a href="/admin/feedback.html" class="admin-nav-item">
            <div class="admin-nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <div class="admin-nav-content">
              <h3 class="admin-nav-title">意见反馈</h3>
              <p class="admin-nav-desc">回复用户的需求和使用问题</p>
            </div>
          </a>

          <a href="/admin/pinyin.html" class="admin-nav-item">
            <div class="admin-nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7V4h16v3"></path>
                <path d="M9 20h6"></path>
                <path d="M12 4v16"></path>
              </svg>
            </div>
            <div class="admin-nav-content">
              <h3 class="admin-nav-title">注音勘误</h3>
              <p class="admin-nav-desc">修正多音字的自动注音错误</p>
            </div>
          </a>
        </div>

        <p class="account-msg" id="msg-accounts"></p>
      </section>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/progress-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/admin-page.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
