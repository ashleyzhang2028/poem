<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>管理后台 · 跬步</title>
  <meta name="description" content="跬步管理后台：账号名录与 Free / Pro / Max 层级、用户报告、注音勘误。全部以数据库为准。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<body data-nav="admin" data-dock="off" data-back="/mine/" data-page="管理后台" data-sub="账号管理 · 用户报告 · 注音勘误">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="admin-page">

      <section class="account-card" id="deny-card" hidden>
        <h2 class="account-card-title danger-title">没有权限</h2>
        <p class="account-lead" id="deny-lead"></p>
        <button class="account-btn ghost" id="btn-back-profile" type="button">返回</button>
      </section>

      <section class="account-card" id="grant-card" hidden>
        <h2 class="account-card-title">账号管理</h2>
        <p class="account-lead">修改角色或层级后立即保存，对方刷新页面后生效。</p>
        <div class="admin-table-scroll">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">用户</th>
                <th scope="col">角色</th>
                <th scope="col">层级</th>
              </tr>
            </thead>
            <tbody id="accounts-body"></tbody>
          </table>
        </div>
        <p class="account-hint" id="accounts-empty" hidden>暂无账号。</p>
        <p class="account-hint" id="accounts-note" hidden></p>
        <p class="account-msg" id="msg-accounts"></p>
      </section>

      <section class="account-card" id="reports-card" hidden>
        <h2 class="account-card-title">用户报告</h2>
        <p class="account-lead" id="reports-intro">用户在篇目页提交的问题。更新状态后，用户可在「我的报告」中看到；注音类问题可在下方「注音勘误」中直接修正。</p>

        <div class="admin-report-tools">
          <div class="admin-report-counts" id="report-counts" role="group" aria-label="按状态筛选"></div>
          <button class="account-btn ghost" id="btn-reports-reload" type="button">刷新</button>
        </div>

        <ul class="report-list" id="reports-list"></ul>
        <p class="account-hint" id="reports-empty" hidden>暂无报告。</p>
        <p class="account-hint" id="reports-note" hidden></p>
        <p class="account-msg" id="msg-reports"></p>
      </section>

      <section class="account-card" id="pinyin-card" hidden>
        <h2 class="account-card-title">注音勘误</h2>
        <p class="account-lead">自动注音偶有读错。搜索并选中篇目，点「选句」选出原句，再填写第几个字及其正确读音，保存后立即生效。</p>

        <div class="admin-steps">
          <div class="account-field">
            <label class="account-label" for="pf-wid">篇目</label>
            <input id="pf-wid" class="account-input" type="text" autocomplete="off"
                   spellcheck="false" placeholder="输入篇名搜索，如 滕王阁序" maxlength="40" />
          </div>
          <div class="account-field">
            <label class="account-label" for="pf-line">原句</label>
            <div class="admin-line-row">
              <input id="pf-line" class="account-input" type="text" autocomplete="off"
                     spellcheck="false" placeholder="如 秋水共长天一色。" maxlength="120" />
              <button class="account-btn ghost" id="btn-pf-fill" type="button">选句</button>
            </div>
          </div>
          <p class="account-hint" id="pf-picked" hidden></p>
          <div class="admin-step-pair">
            <div class="account-field">
              <label class="account-label" for="pf-at">第几个字</label>
              <input id="pf-at" class="account-input" type="number" min="1" step="1" value="1" />
            </div>
            <div class="account-field">
              <label class="account-label" for="pf-py">正确读音</label>
              <input id="pf-py" class="account-input" type="text" autocomplete="off"
                     spellcheck="false" placeholder="带声调，如 cháng" maxlength="12" />
            </div>
          </div>
        </div>

        <ul class="admin-hits" id="pf-hits" hidden></ul>
        <button class="account-btn" id="btn-pf-add" type="button">保存勘误</button>
        <p class="account-msg" id="msg-pf"></p>

        <div class="admin-sub">
          <h3 class="admin-sub-title">已保存的勘误 <span class="admin-count" id="pf-count">0</span></h3>
          <ul class="admin-fix-list" id="pf-list"></ul>
          <p class="account-hint" id="pf-empty" hidden>暂无勘误。</p>
          <p class="account-hint" id="pf-note" hidden></p>
        </div>
        <div class="confirm-row admin-reload-row">
          <button class="account-btn ghost" id="btn-pf-export" type="button">复制勘误表</button>
        </div>
      </section>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/progress-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/report.js"></script>
  <script src="/data/pinyin-table.js"></script>
  <script src="/data/common-chars.js"></script>
  <script src="/data/works-index.js"></script>
  <script src="/data/text-master.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/text-master.js"></script>
  <script src="/data/index.js"></script>
  <script src="/js/pinyin-edit.js"></script>
  <script src="/js/pinyin.js"></script>
  <script src="/js/admin-page.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
