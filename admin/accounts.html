<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>账号管理 · 跬步</title>
  <meta name="description" content="跬步管理后台：账号名录与 Free / Pro / Max 层级。全部以数据库为准。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/account.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VEFD6BLJV5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VEFD6BLJV5');
  </script>
</head>
<body data-nav="admin" data-dock="off" data-back="/admin/" data-page="账号管理" data-sub="管理后台">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="admin-page">

      <section class="account-card" id="deny-card" hidden>
        <h2 class="account-card-title danger-title">没有权限</h2>
        <p class="account-lead" id="deny-lead"></p>
        <button class="account-btn ghost" id="btn-back-profile" type="button">返回</button>
      </section>

      <section class="account-card" id="grant-card" hidden>
        <h2 class="account-card-title">账号管理</h2>
        <div class="admin-table-scroll">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">用户</th>
                <th scope="col">角色</th>
                <th scope="col">层级</th>
              </tr>
            </thead>
            <tbody id="accounts-body"></tbody>
          </table>
        </div>
        <p class="account-hint" id="accounts-empty" hidden>暂无账号。</p>
        <p class="account-hint" id="accounts-note" hidden></p>
        <p class="account-msg" id="msg-accounts"></p>
      </section>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/progress-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/admin-page.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
