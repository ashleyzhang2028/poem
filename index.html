<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>跬步 · 古诗词背诵</title>
  <meta name="description" content="跬步：一年级至高三古诗词，按遗忘曲线安排复习；小古文可点击阅读。手机、平板、电脑都能用，可添加到主屏幕当 App。" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ===== iOS（苹果手机 / iPad）支持 ===== -->
  <!-- 全屏运行：从主屏幕启动时不显示 Safari 地址栏 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 状态栏样式：default 为白底黑字 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- 添加到主屏幕后的应用名 -->
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <!-- 兼容旧版 iOS -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA 清单 -->
  <link rel="manifest" id="app-manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />

  <!-- 主屏幕图标：覆盖 iPhone / iPad / iPad Pro 各代尺寸，缺尺寸会显示模糊截图 -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="./icons/icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.2C10.2 4.8 7.9 4.2 5 4.2v13.6c2.9 0 5.2.6 7 2 1.8-1.4 4.1-2 7-2V4.2c-2.9 0-5.2.6-7 2Z" />
            <path d="M12 6.2v13.6" />
          </svg>
        </span>
        <div class="brand-text">
          <h1 id="brand-name">跬步</h1>
          <p>一年级至高三 · 按遗忘曲线复习</p>
        </div>
      </div>
      <a id="btn-settings" class="icon-btn" href="./settings.html" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <!-- 齿轮：8 个齿均布在半径 9.7 的圆周上，齿根圆 7.4，整体外轮廓是标准圆（不再是太阳形） -->
          <path d="M10.63 2.40 L13.37 2.40 L13.44 4.74 L16.11 5.85 L17.82 4.24 L19.76 6.18 L18.15 7.89 L19.26 10.56 L21.60 10.63 L21.60 13.37 L19.26 13.44 L18.15 16.11 L19.76 17.82 L17.82 19.76 L16.11 18.15 L13.44 19.26 L13.37 21.60 L10.63 21.60 L10.56 19.26 L7.89 18.15 L6.18 19.76 L4.24 17.82 L5.85 16.11 L4.74 13.44 L2.40 13.37 L2.40 10.63 L4.74 10.56 L5.85 7.89 L4.24 6.18 L6.18 4.24 L7.89 5.85 L10.56 4.74 Z" />
          <circle cx="12" cy="12" r="3.1" />
        </svg>
      </a>
    </header>

    <!-- 今日进度 -->
    <section class="card today-bar">
      <div class="today-left">
        <div class="today-title">今日背诵</div>
        <div class="today-sub" id="today-sub">共 5 首</div>
      </div>
      <div class="today-actions">
        <!-- 朗读全部：把当天几首的标题、朝代、作者与正文依次读出来，不看屏幕也能听 -->
        <button class="today-read" id="today-read" data-on="0" aria-label="依次朗读今天要背的每一首" title="依次朗读今天要背的每一首">
          <span class="play-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7.2 4.6 19.4 12 7.2 19.4Z" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="pause-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8.2 5h2.9v14H8.2Z M12.9 5h2.9v14h-2.9Z" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span id="today-read-text" class="sr-only">播放</span>
        </button>
        <div class="ring" id="today-ring">
          <svg viewBox="0 0 36 36">
            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="ring-fg" id="ring-fg" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <span id="ring-text">0/5</span>
        </div>
      </div>
    </section>

    <!-- 今日 5 首列表 -->
    <section class="list" id="today-list"></section>

    <!-- 全部诗词（可折叠） -->
    <section class="card all-section">
      <button class="collapse-head" id="btn-all">
        <span class="collapse-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.2A1.2 1.2 0 0 1 5.2 4H10v16H5.2A1.2 1.2 0 0 1 4 18.8Z" />
            <path d="M10 4h4.8A1.2 1.2 0 0 1 16 5.2V20h-6Z" />
            <path d="M16 8h2.8A1.2 1.2 0 0 1 20 9.2V20h-4" />
          </svg>
        </span>
        <span id="all-label">本年级本学期全部诗词</span>
        <span id="all-count" class="badge">0</span>
        <span class="arrow">▾</span>
      </button>
      <div class="collapse-body" id="all-body" hidden>
        <div class="stats-row" id="stats-row"></div>
        <div class="list" id="all-list"></div>
      </div>
    </section>

    <!-- 小古文入口：不参与遗忘曲线排期，只供点击学习；放在「本年级本学期全部诗词」之后 -->
    <a class="card classic-entry" href="./classic.html" id="classic-entry">
      <span class="classic-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.2V5.4A1.4 1.4 0 0 1 5.4 4H11v15.2H5.4A1.4 1.4 0 0 1 4 19.2Z" />
          <path d="M11 4h7.6A1.4 1.4 0 0 1 20 5.4v13.8a1.4 1.4 0 0 1-1.4 1.4H11" />
          <path d="M7 9.5h2.4M7 13h2.4M14 9.5h2.6M14 13h2.6" />
        </svg>
      </span>
      <span class="classic-main">
        <span class="classic-title">小古文</span>
        <span class="classic-sub">100 篇 · 想读哪篇点哪篇</span>
      </span>
      <span class="item-arrow">›</span>
    </a>

  </div>

  <!-- 诗词详情弹层 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-close="1" aria-label="关闭">✕</button>
      <div class="modal-head">
        <h2 id="m-title"></h2>
        <div class="meta">
          <span id="m-dynasty" class="tag"></span>
          <span id="m-author" class="tag"></span>
          <span id="m-grade" class="tag ghost"></span>
        </div>
      </div>
      <div class="modal-tools">
        <div class="seg mini" id="m-pinyin-seg" data-on="0" role="group" aria-label="注音方式">
          <button data-mode="off" aria-pressed="false">不注音</button>
          <button data-mode="rare" class="active" aria-pressed="true">生字</button>
          <button data-mode="all" aria-pressed="false">全文</button>
        </div>
        <button class="mini-btn" id="m-read-btn" data-on="0" aria-pressed="false">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 9.5v5h3l4.2 3.4V6.1L7 9.5H4Z" />
              <path class="wave1" d="M15.2 9.2a4 4 0 0 1 0 5.6" />
              <path class="wave2" d="M17.8 6.6a7.6 7.6 0 0 1 0 10.8" />
            </svg>
          </span>
          <span id="m-read-text">朗读</span>
        </button>
      </div>
      <pre class="poem-text" id="m-text"></pre>
      <div class="modal-progress" id="m-progress"></div>
      <div class="actions">
        <button class="btn bad" data-result="bad">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.6 15.6c1.8-1.6 5-1.6 6.8 0" />
              <path d="M9.4 9.9 10.6 11 M14.6 9.9 13.4 11 M9.4 11 10.6 9.9 M14.6 11 13.4 9.9" />
            </svg>
          </span>忘记</button>
        <button class="btn fuzzy" data-result="fuzzy">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.6 15.8h6.8" />
              <path d="M9.4 9.7v1.8 M14.6 9.7v1.8" />
            </svg>
          </span>模糊</button>
        <button class="btn good" data-result="good">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.2 14.2c1.9 2.1 5.7 2.1 7.6 0" />
              <path d="M9.4 9.6v1.9 M14.6 9.6v1.9" />
            </svg>
          </span>记住</button>
      </div>
      <div class="hint" id="m-hint"></div>
    </div>
  </div>

  <input type="file" id="file-import" accept="application/json" hidden />
  <div class="toast" id="toast" hidden></div>

  <!-- iOS「添加到主屏幕」引导条：仅 iPhone/iPad 且未安装时出现 -->
  <div class="ios-install-tip" id="ios-install-tip" hidden>
    <span class="ios-tip-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6.5" y="2.6" width="11" height="18.8" rx="2.6" />
        <path d="M12 18.4h.01" />
        <path d="M12 6.2v7 M9.6 11.2 12 13.6l2.4-2.4" />
      </svg>
    </span>
    <span class="ios-tip-text">想看桌面图标？点底部「分享」，选「添加到主屏幕」</span>
    <button type="button" id="ios-install-close" class="ios-tip-close" aria-label="关闭提示">知道了</button>
  </div>

  <script src="data/poems-1.js"></script>
  <script src="data/poems-2.js"></script>
  <script src="data/poems-3.js"></script>
  <script src="data/poems-4.js"></script>
  <script src="data/poems-5.js"></script>
  <script src="data/poems-6.js"></script>
  <script src="data/poems-7.js"></script>
  <script src="data/poems-8.js"></script>
  <script src="data/poems-9.js"></script>
  <script src="data/poems-10.js"></script>
  <script src="data/poems-11.js"></script>
  <script src="data/poems-12.js"></script>
  <script src="data/index.js"></script>
  <script src="data/pinyin-table.js"></script>
  <script src="data/common-chars.js"></script>
  <script src="js/pinyin.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/manifest-loader.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
