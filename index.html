<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>跬步 · 古诗词背诵</title>
  <meta name="description" content="跬步：一年级至高三古诗词，按遗忘曲线安排复习。手机、平板、电脑都能用，可添加到主屏幕当 App。" />
  <meta name="format-detection" content="telephone=no" />

  <!-- ===== iOS（苹果手机 / iPad）支持 ===== -->
  <!-- 全屏运行：从主屏幕启动时不显示 Safari 地址栏 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- 状态栏样式：default 为白底黑字 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- 添加到主屏幕后的应用名 -->
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <!-- 兼容旧版 iOS -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA 清单 -->
  <link rel="manifest" id="app-manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />

  <!-- 主屏幕图标：覆盖 iPhone / iPad / iPad Pro 各代尺寸，缺尺寸会显示模糊截图 -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="./icons/icon-120.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-nav="home" data-page="的古诗词" data-sub="按遗忘曲线安排复习 · 小古文想读哪篇点哪篇">
  <div class="app" id="app">
    <!-- 顶部栏：由 js/chrome.js 统一渲染（logo + 跬步 + 页面名 + 动作位） -->
    <header class="topbar"></header>

    <!-- 今日进度 -->
    <section class="card today-bar">
      <div class="today-left">
        <div class="today-title">今日背诵</div>
        <div class="today-sub" id="today-sub">共 5 首</div>
      </div>
      <div class="today-actions">
        <!-- 朗读全部：把当天几首的标题、朝代、作者与正文依次读出来，不看屏幕也能听 -->
        <button class="today-read" id="today-read" data-on="0" aria-label="依次朗读今天要背的每一首" title="依次朗读今天要背的每一首">
          <span class="play-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7.2 4.6 19.4 12 7.2 19.4Z" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="pause-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8.2 5h2.9v14H8.2Z M12.9 5h2.9v14h-2.9Z" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span id="today-read-text" class="sr-only">播放</span>
        </button>
        <div class="ring" id="today-ring">
          <svg viewBox="0 0 36 36">
            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path class="ring-fg" id="ring-fg" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <span id="ring-text">0/5</span>
        </div>
      </div>
    </section>

    <!-- 今日 5 首列表 -->
    <section class="list" id="today-list"></section>

    <!-- 全部诗词（可折叠） -->
    <section class="card all-section">
      <button class="collapse-head" id="btn-all">
        <span class="collapse-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.2A1.2 1.2 0 0 1 5.2 4H10v16H5.2A1.2 1.2 0 0 1 4 18.8Z" />
            <path d="M10 4h4.8A1.2 1.2 0 0 1 16 5.2V20h-6Z" />
            <path d="M16 8h2.8A1.2 1.2 0 0 1 20 9.2V20h-4" />
          </svg>
        </span>
        <span id="all-label">本年级本学期全部诗词</span>
        <span id="all-count" class="badge">0</span>
        <!-- 折叠箭头：空心描边三角（与列表右侧「›」同一套描边语言）。
             收起时朝下、展开时朝上，由 .collapse-head.open 只旋转不换图，
             笔画粗细和「›」一致，不再是实心 ▾ 那种另一套风格。 -->
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.6 9.8 12 15.2l5.4-5.4" />
          </svg>
        </span>
      </button>
      <div class="collapse-body" id="all-body" hidden>
        <div class="stats-row" id="stats-row"></div>
        <div class="list" id="all-list"></div>
      </div>
    </section>

    <!-- 版权 + 用户协议 / 隐私条款已挪到设置整页（settings.html）底部 -->
  </div>

  <!-- 诗词详情弹层 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" data-close="1" aria-label="关闭">✕</button>
      <div class="modal-head">
        <h2 id="m-title"></h2>
        <div class="meta">
          <span id="m-dynasty" class="tag"></span>
          <span id="m-author" class="tag"></span>
          <span id="m-grade" class="tag ghost"></span>
        </div>
      </div>
      <!-- 阅读辅助工具条（第一行）：对齐 / 字号 / 注音
           与小古文详情页同一套控件、同一顺序，用户在两个页面不用重新学一遍。
           「已读」是小古文专有的进度标记，古诗词这边由「忘记 / 模糊 / 记住」承担，故不设。 -->
      <div class="reader-actions" id="m-actions-main">
        <div class="seg mini icon-seg" id="m-align-seg" role="group" aria-label="正文对齐方式">
          <button type="button" data-align="left" aria-pressed="false" title="左对齐" aria-label="左对齐">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 6.5h16M4 11h10.5M4 15.5h16M4 20h8" />
            </svg></span>
          </button>
          <button type="button" data-align="center" class="active" aria-pressed="true" title="居中对齐" aria-label="居中对齐">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 6.5h16M6.8 11h10.4M4 15.5h16M8 20h8" />
            </svg></span>
          </button>
          <button type="button" data-align="right" aria-pressed="false" title="右对齐" aria-label="右对齐">
            <span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 6.5h16M9.5 11H20M4 15.5h16M12 20h8" />
            </svg></span>
          </button>
        </div>
        <div class="seg mini font-seg" id="m-font-seg" role="group" aria-label="正文字号">
          <button type="button" id="m-font-down" aria-label="缩小字号" title="缩小字号">A－</button>
          <button type="button" id="m-font-up" aria-label="放大字号" title="放大字号">A＋</button>
        </div>
        <div class="seg mini" id="m-pinyin-seg" data-on="0" role="group" aria-label="注音方式">
          <button data-mode="off" aria-pressed="false">不注音</button>
          <button data-mode="rare" class="active" aria-pressed="true">生字</button>
          <button data-mode="all" aria-pressed="false">全文</button>
        </div>
      </div>
      <!-- 阅读辅助工具条（第二行）：原文一个播放键 + 译文开关。
           不用再并排放「原文 / 译文」两个朗读键 —— 译文展开后，
           译文标题旁会出现它自己的那颗朗读键，一篇文章同时只看到一个播放信号。 -->
      <div class="reader-actions icon-row" id="m-actions-icons">
        <!-- 原文：▶ 与 ⏸ 是同一个按钮的两种状态（播放中原地换成暂停），
             绝不同时并排出现两个图标 -->
        <button type="button" class="mini-btn" id="m-read-btn" data-on="0" aria-pressed="false" title="朗读原文：标题、朝代、作者与正文">
          <span class="btn-icon play-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7.2 4.6 19.4 12 7.2 19.4Z" fill="currentColor" stroke="none" /></svg>
          </span>
          <span class="btn-icon pause-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8.2 5h2.9v14H8.2Z M12.9 5h2.9v14h-2.9Z" fill="currentColor" stroke="none" /></svg>
          </span>
          <span class="sr-only" id="m-read-text">朗读原文</span>
        </button>
        <button type="button" class="mini-btn" id="m-trans-toggle" data-on="0" aria-pressed="false" title="显示译文">
          <span class="btn-icon play-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.6h9.2a1.4 1.4 0 0 1 1.4 1.4v9.4a1.4 1.4 0 0 1-1.4 1.4H4Z" />
              <path d="M7 9.4h4.6M7 12.8h3.2" />
              <path d="M15.4 9.2h3.2a1.4 1.4 0 0 1 1.4 1.4v6.2a1.4 1.4 0 0 1-1.4 1.4h-2.2l-1 1.6-.9-1.6h-.1" />
            </svg>
          </span>
          <span class="btn-icon pause-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.6h9.2a1.4 1.4 0 0 1 1.4 1.4v9.4a1.4 1.4 0 0 1-1.4 1.4H4Z" />
              <path d="M7 9.4h4.6M7 12.8h3.2" />
              <path d="M15.4 9.2h3.2a1.4 1.4 0 0 1 1.4 1.4v6.2a1.4 1.4 0 0 1-1.4 1.4h-2.2l-1 1.6-.9-1.6h-.1" />
              <path d="M20.6 4.2 15.6 20.2" />
            </svg>
          </span>
          <span class="sr-only" id="m-trans-toggle-text">显示译文</span>
        </button>
      </div>
      <pre class="poem-text" id="m-text"></pre>
      <!-- 白话译文：与小古文详情页同一套译文框 -->
      <section class="trans-box" id="m-trans" hidden>
        <div class="trans-head">
          <h3>白话译文</h3>
          <!-- 译文朗读键：译文展开后才出现，只在译文标题这一处，不与原文键并排 -->
          <button type="button" class="trans-read" id="m-trans-read" data-on="0" aria-pressed="false" disabled title="朗读白话译文">
            <span class="btn-icon play-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7.2 4.6 19.4 12 7.2 19.4Z" fill="currentColor" stroke="none" /></svg>
            </span>
            <span class="btn-icon pause-glyph" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8.2 5h2.9v14H8.2Z M12.9 5h2.9v14h-2.9Z" fill="currentColor" stroke="none" /></svg>
            </span>
            <span id="m-trans-read-text">朗读</span>
          </button>
        </div>
        <p id="m-trans-text"></p>
      </section>
      <div class="modal-progress" id="m-progress"></div>
      <div class="actions">
        <button class="btn bad" data-result="bad">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.6 15.6c1.8-1.6 5-1.6 6.8 0" />
              <path d="M9.4 9.9 10.6 11 M14.6 9.9 13.4 11 M9.4 11 10.6 9.9 M14.6 11 13.4 9.9" />
            </svg>
          </span>忘记</button>
        <button class="btn fuzzy" data-result="fuzzy">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.6 15.8h6.8" />
              <path d="M9.4 9.7v1.8 M14.6 9.7v1.8" />
            </svg>
          </span>模糊</button>
        <button class="btn good primary-btn" data-result="good">
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.2 14.2c1.9 2.1 5.7 2.1 7.6 0" />
              <path d="M9.4 9.6v1.9 M14.6 9.6v1.9" />
            </svg>
          </span>记住</button>
      </div>
      <div class="hint" id="m-hint"></div>
    </div>
  </div>

  <input type="file" id="file-import" accept="application/json" hidden />
  <div class="toast" id="toast" hidden></div>

  <!-- iOS「添加到主屏幕」引导条：仅 iPhone/iPad 且未安装时出现 -->
  <div class="ios-install-tip" id="ios-install-tip" hidden>
    <span class="ios-tip-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6.5" y="2.6" width="11" height="18.8" rx="2.6" />
        <path d="M12 18.4h.01" />
        <path d="M12 6.2v7 M9.6 11.2 12 13.6l2.4-2.4" />
      </svg>
    </span>
    <span class="ios-tip-text">想看桌面图标？点底部「分享」，选「添加到主屏幕」</span>
    <button type="button" id="ios-install-close" class="ios-tip-close" aria-label="关闭提示">知道了</button>
  </div>

  <script src="data/poems-1.js"></script>
  <script src="data/poems-2.js"></script>
  <script src="data/poems-3.js"></script>
  <script src="data/poems-4.js"></script>
  <script src="data/poems-5.js"></script>
  <script src="data/poems-6.js"></script>
  <script src="data/poems-7.js"></script>
  <script src="data/poems-8.js"></script>
  <script src="data/poems-9.js"></script>
  <script src="data/poems-10.js"></script>
  <script src="data/poems-11.js"></script>
  <script src="data/poems-12.js"></script>
  <script src="data/index.js"></script>
  <script src="data/pinyin-table.js"></script>
  <script src="data/common-chars.js"></script>
  <script src="js/pinyin.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/manifest-loader.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
