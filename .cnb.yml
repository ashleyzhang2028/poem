# 古诗词背诵 · 静态站点（PWA）
# main 分支 push / 合并后：跑测试 → 自动同步到 GitHub 仓库 ashleyzhang2028/poem
# 手动触发：web_trigger 起预览服务；web_trigger_push_github 手动推送到 GitHub

# GitHub 推送脚本（多处复用）
.push-to-github: &push-to-github
  imports:
    - https://cnb.cool/npu-gpu-cpu/ashleyzhang2028-poem/-/blob/main/github.yml
  stages:
    - name: push
      script: |
        set -e
        : "${GITHUB_TOKEN:?GITHUB_TOKEN 未注入，请检查密钥仓库 github.yml}"
        USER="${GITHUB_USER:-ashleyzhang2028}"
        REPO="${GITHUB_REPO:-ashleyzhang2028/poem}"
        BRANCH="${GITHUB_BRANCH:-main}"

        git config --global user.name  "${USER}"
        git config --global user.email "${USER}@users.noreply.github.com"
        git remote remove github 2>/dev/null || true
        git remote add github "https://${USER}:${GITHUB_TOKEN}@github.com/${REPO}.git"

        echo "推送 $(git rev-parse --short HEAD) 到 github.com/${REPO} 分支 ${BRANCH} ..."
        git push --force github "HEAD:${BRANCH}"
        echo "推送完成 ✅  https://github.com/${REPO}"

main:
  push:
    - name: test
      docker:
        build: image/Dockerfile
      stages:
        # ⚠️ Issue #278：这一条 `install-deps` **整条删掉**了。
        #
        # 它原先装两样东西：jsdom 与 puppeteer。前者是界面测试（jsdom 起真页面）
        # 要的，后者那一层要起真 Chrome（还要先下一份浏览器）。
        # 而界面测试这一轮**整层删除**（用户 2026-09-25：「删除尽可能多的其他
        # 测试，特别是界面相关的测试，我的目的是构建时间变短」），
        # test/run.sh 现在全是纯 Node —— 一个依赖都不装。
        #
        # 省下的是什么：`npm i jsdom@^26 puppeteer` 本身要跑 npm 解析 + 下一份
        # Chromium（`.cache/puppeteer`，几百兆，缓存没命中时是分钟级）。
        # 那段注释里记的「两条 npm i 互相清包让 jsdom 装不上」的老坑，
        # 也随着这一条一起消失了 —— 现在没有需要「同时装」的东西了。
        - name: run-tests
          script: bash test/run.sh

    # 合并进 main 后自动同步 GitHub，无需再手动点按钮
    - name: sync-to-github
      docker:
        image: node:20
      <<: *push-to-github

  # ==========================================================================
  # 2D · 配置与真开通：探活 + 备份（docs/architecture.md §4.12 的第 D 步）
  # --------------------------------------------------------------------------
  # 定时任务写在这个仓库，而不是 GitHub Actions：CNB 是本仓库
  # （npu-gpu-cpu/poem）的主仓库，GitHub 那份是**同步出去的镜像**；密钥
  # （SUPABASE_*）放在 CNB 的密钥仓库，一个地方注入、探活与备份共用。
  # 在镜像仓库上做，等于把密钥多复制一份到第二个平台 —— 成本更高、收益一样。
  #
  # ⚠️ 密钥没配时这两条会**如实失败**（报「密钥未注入」），不会静默通过。
  # ==========================================================================

  # 每 5 天探活一次。免费档的判定是「连续 7 天没有任何请求」就整个项目停机
  # （用户看到的是「打不开」，不是「有点慢」）；定时任务在高负载时可能延迟
  # 数小时、偶尔被跳过，排 5 天则跳过一次也仍在 7 天窗口内。
  # ⚠️ 探活**必须打到数据库** —— PostgREST 查询才算活动，根路径与状态页不算。
  "crontab: 0 3 */5 * *":
    - name: supabase-keepalive
      docker:
        image: node:20
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-secrets/-/blob/main/supabase.yml
      stages:
        - name: ping-db
          script: |
            set -e
            : "${SUPABASE_URL:?SUPABASE_URL 未注入，请检查密钥仓库 supabase.yml}"
            : "${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY 未注入，请检查密钥仓库 supabase.yml}"
            echo "探活：打一次真查询（不打印任何密钥，也不打印响应体）"
            # ⚠️ apikey 头必须是**密钥本身**，不是 SUPABASE_URL。
            #    原先这里写的是 `apikey: $SUPABASE_URL` —— 把一个 URL 当 key 发出去，
            #    Supabase 一律回 401。症状正好是「密钥明明注入了，探活却天天红」，
            #    于是这一条会被误读成「密钥仓库没配好」而反复去查密钥仓库。
            #    PostgREST 认两个头：apikey 给的是 key（这里用 service_role），
            #    Authorization 给的是 Bearer token —— 同一个 key 两处都要带。
            #
            # ⚠️ 只读**不够**（Issue #225 补的）：注册那个「服务端出了点问题」
            #    最常见的死法是**写** —— 读得通、写不通，`select uid` 照样回 200。
            #    所以这里读一次、再写一次（写的那行立刻删掉，不堆垃圾）。
            AUTH=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")

            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/accounts?select=uid&limit=1" "${AUTH[@]}")
            echo "读 accounts：HTTP $CODE"
            # 读不通就直接红，不必再试写（写那一步的报错会更绕）
            test "$CODE" = "200"

            # 写探针：往 codes 插一行诊断标记，成功或失败都立刻删掉。
            # code_id 用固定值 + **先删再插**：上一次失败留下的残行会让这次回 409
            # （主键冲突），而 409 会被误读成「写不通」—— 顺序固定就不会。
            PROBE_BODY='{"code_id":"keepalive-probe","uid":"u_keepalive","purpose":"keepalive","code_hash":"probe","salt":"probe","created_at":0,"expires_at":0,"consumed_at":null,"attempts":0}'
            curl -sS -o /dev/null -X DELETE \
              "$SUPABASE_URL/rest/v1/codes?code_id=eq.keepalive-probe" "${AUTH[@]}" || true
            WCODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              "$SUPABASE_URL/rest/v1/codes" "${AUTH[@]}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "$PROBE_BODY")
            echo "写 codes：HTTP $WCODE"
            # 收尾：把探针那行删掉（成不成功都删；留着会让 admin 名录里多一行假码）
            curl -sS -o /dev/null -X DELETE \
              "$SUPABASE_URL/rest/v1/codes?code_id=eq.keepalive-probe" "${AUTH[@]}" || true

            # 失败必须红：探活静默挂掉三个月，会以「某天用户突然登不上」的形式暴露。
            # 写探针期望 201（PostgREST 建行）；204 也算成（有的网关回 204）。
            case "$WCODE" in
              201|204) echo "写入探针通过（读 200 / 写 $WCODE）";;
              *) echo "写入探针失败：HTTP $WCODE —— 读得通、写不通正是注册 500 的第一大成因" >&2; exit 1;;
            esac

  # 每周备份一次。免费档**没有自动备份**（无 PITR），误删就是永久消失。
  "crontab: 30 4 * * 1":
    - name: supabase-backup
      # ⚠️ 镜像里的 pg_dump 版本**必须 ≥ Supabase 服务端**（现为 17.6）。
      #    早先这里用的是 postgres:16 —— 但 node:20 里根本没有 pg_dump，
      #    而 postgres:16 里的 pg_dump 只有 16，对着 17 的服务端跑会直接
      #    abort（注意不是警告）：
      #      pg_dump: error: aborting because of server version mismatch
      #      pg_dump: detail: server version: 17.6; pg_dump version: 16.15
      #    于是备份**一条都没产出**，还留下一个空文件 —— 见 docs/architecture.md §4.12 第 D 步。
      #    pg_dump 允许比服务端**高**，不允许低；所以镜像跟着服务端大版本走，
      #    这里用 postgres:17（自带 pg_dump 17）。服务端升到 18 时同步换 postgres:18。
      #    另：pg_dump 是客户端工具，**不需要**与服务端同发行版，
      #    镜像只是取工具的地方（image 可以不重，工具必须够新）。
      docker:
        image: postgres:17
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-secrets/-/blob/main/supabase.yml
      stages:
        - name: pg-dump
          script: |
            set -e
            : "${SUPABASE_DB_URL:?SUPABASE_DB_URL 未注入，请检查密钥仓库 supabase.yml}"
            command -v pg_dump >/dev/null 2>&1 || {
              echo "本镜像没有 pg_dump —— 见 docs/architecture.md §4.12 第 D 步";
              exit 1;
            }
            # ⚠️ pg_dump 从 URL 里**自己拆**主机名，不认 shell 的引号。密码含
            #    @ : / # ? 这类保留字符时必须百分号编码（@ → %40），否则它会把
            #    密码里那一段当成主机名，报的是：
            #      could not translate host name "…@db.<ref>.supabase.co"
            #    —— **看着像 DNS 坏了，其实只是密码没转义**。这种报错会把人
            #    引向「网络 / DNS / 项目被暂停」三条错路，所以先按 URL 形状自检。
            case "$SUPABASE_DB_URL" in
              postgres://*|postgresql://*) : ;;
              *) echo "SUPABASE_DB_URL 必须以 postgresql:// 开头（Project Settings → Database → Connection string 的模板）"; exit 1 ;;
            esac
            DB_HOST=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[a-z]+://[^@/]*@##; s#[:/].*$##')
            case "$DB_HOST" in
              *@*)
                echo "SUPABASE_DB_URL 的密码里含未转义的 @ —— 用户名/主机名会被拆错，"
                echo "pg_dump 于是一律报 could not translate host name（那**不是** DNS 坏了）。"
                echo "把密码里的特殊字符百分号编码后再填：@ → %40  : → %3A  / → %2F  # → %23  ? → %3F"
                exit 1
                ;;
            esac
            # ⚠️ 版本自检：pg_dump 比服务端**大版本低**时会直接 abort
            #    （不是警告、不是「能跑但少东西」）：
            #      pg_dump: error: aborting because of server version mismatch
            #      pg_dump: detail: server version: 17.6; pg_dump version: 16.15
            #    这时备份是**零产出**的，而且 shell 重定向已经建好了空文件 ——
            #    于是「备份存在但只有 0 字节」，比彻底失败更危险。
            #    先把版本打出来，再让 pg_dump 自己去连（服务端版本只有连上才知道）。
            pg_dump --version
            mkdir -p backup
            STAMP=$(date +%Y%m%d)
            OUT="backup/kuibu-$STAMP.sql"
            # 失败时把半截/空文件删掉 —— 留着它就会被人当成「这天备份过了」
            rm -f "$OUT"
            if ! pg_dump --no-owner --no-privileges "$SUPABASE_DB_URL" > "$OUT"; then
              rm -f "$OUT"
              echo "备份失败，未产出文件。若是 server version mismatch：" >&2
              echo "  镜像里的 pg_dump 比 Supabase 服务端低一个大版本（16 对 17），" >&2
              echo "  把 .cnb.yml 的 docker.image 换成 postgres:<服务端大版本> 即可。" >&2
              echo "  pg_dump 允许比服务端高，不允许低。（0 字节的 .sql 不是备份）" >&2
              exit 1
            fi
            # 空文件同样不算备份：pg_dump 静默失败过一次，别让 0 字节过门
            SIZE=$(wc -c < "$OUT")
            echo "备份已生成：$OUT（$SIZE 字节）"
            test "$SIZE" -gt 0

  pull_request:
    - name: pr-test
      docker:
        build: image/Dockerfile
      stages:
        # ⚠️ Issue #278：`install-deps` 整条删掉（理由见 main.push 那一条：
        # 界面测试整层删除，test/run.sh 现在一个依赖都不装）。
        - name: run-tests
          script: bash test/run.sh

$:
  # 手动触发：推送到 GitHub
  web_trigger_push_github:
    - name: push-to-github
      docker:
        image: node:20
      <<: *push-to-github

  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: node scripts/serve.js
