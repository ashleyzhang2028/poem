# 古诗词背诵 · 静态站点（PWA）
# push 到 main / PR 时自动跑测试；web_trigger 可起预览服务

main:
  push:
    - name: test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            npm i jsdom --no-save --no-fund --no-audit
            npm i puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

  pull_request:
    - name: pr-test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            npm i jsdom --no-save --no-fund --no-audit
            npm i puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

$:
  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: node scripts/serve.js
