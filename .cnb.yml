# 古诗词背诵 · 静态站点（PWA）
# push 到 main / PR 时自动跑测试；web_trigger 可起预览服务

main:
  push:
    - name: test
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm i jsdom --no-save --no-fund --no-audit
            # puppeteer 用于真实浏览器跑 PWA / iOS 兼容测试
            npm i puppeteer --no-save --no-fund --no-audit || echo "puppeteer 安装失败，将跳过 PWA 测试"
        - name: run-tests
          script: ./test/run.sh

  pull_request:
    - name: pr-test
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: |
            set -e
            npm i jsdom --no-save --no-fund --no-audit
            npm i puppeteer --no-save --no-fund --no-audit || echo "puppeteer 安装失败，将跳过 PWA 测试"
        - name: run-tests
          script: ./test/run.sh

$:
  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: node scripts/serve.js
