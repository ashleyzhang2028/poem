# 古诗词背诵 · 静态站点（PWA）
# main 分支 push / 合并后：跑测试 → 自动同步到 GitHub 仓库 ashleyzhang2028/poem
# 手动触发：web_trigger 起预览服务；web_trigger_push_github 手动推送到 GitHub

# GitHub 推送脚本（多处复用）
.push-to-github: &push-to-github
  imports:
    - https://cnb.cool/npu-gpu-cpu/ashleyzhang2028-poem/-/blob/main/github.yml
  stages:
    - name: push
      script: |
        set -e
        : "${GITHUB_TOKEN:?GITHUB_TOKEN 未注入，请检查密钥仓库 github.yml}"
        USER="${GITHUB_USER:-ashleyzhang2028}"
        REPO="${GITHUB_REPO:-ashleyzhang2028/poem}"
        BRANCH="${GITHUB_BRANCH:-main}"

        git config --global user.name  "${USER}"
        git config --global user.email "${USER}@users.noreply.github.com"
        git remote remove github 2>/dev/null || true
        git remote add github "https://${USER}:${GITHUB_TOKEN}@github.com/${REPO}.git"

        echo "推送 $(git rev-parse --short HEAD) 到 github.com/${REPO} 分支 ${BRANCH} ..."
        git push --force github "HEAD:${BRANCH}"
        echo "推送完成 ✅  https://github.com/${REPO}"

main:
  push:
    - name: test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            # 必须**一条命令**同时装 jsdom 与 puppeteer。
            # 分成两条 `npm i` 时，第二条会因为 package.json 里没有声明这两个包
            # （只用 --no-save 临时装）而把第一条的成果当作「多余的包」清掉 ——
            # 实测：先装 jsdom（39 个包），再装 puppeteer 会打印
            # "added 98 packages, and removed 39 packages"，jsdom 被整个移除。
            # 之后 test/run.sh 发现 require.resolve('jsdom') 失败，转入「临时安装」分支，
            # 在另一处目录里再装一份 jsdom，依赖解析于是变得不确定
            # （小古文层曾因此在 CI 上抛出 TypeError 而整层炸掉）。
            #
            # jsdom 固定大版本：本镜像的 Node 是 20，而 jsdom 30 起把 engines
            # 提到了 ^22.22.2 || ^24.15.0 || >=26.0.0 —— 在 Node 20 上属于「未支持」，
            # 装到会上但 DOM 行为漂移（jsdom 27~29 的 element.querySelector('#dup-id')
            # 只认文书里第一枚 id，恰好把「页面顶栏与阅读器顶栏都渲染出 id="top-act"」
            # 这个真 bug 暴露成整层 ✗；上层若只跟着升 jsdom 就会让红绿随版本跳）。
            # 这里锁 ^26（engines: >=18），要升 Node 时同步放开。
            npm i jsdom@^26 puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

    # 合并进 main 后自动同步 GitHub，无需再手动点按钮
    - name: sync-to-github
      docker:
        image: node:20
      <<: *push-to-github

  # ==========================================================================
  # 2D · 配置与真开通：探活 + 备份（docs/architecture.md §4.12 的第 D 步）
  # --------------------------------------------------------------------------
  # 定时任务写在这个仓库，而不是 GitHub Actions：CNB 是本仓库
  # （npu-gpu-cpu/poem）的主仓库，GitHub 那份是**同步出去的镜像**；密钥
  # （SUPABASE_*）放在 CNB 的密钥仓库，一个地方注入、探活与备份共用。
  # 在镜像仓库上做，等于把密钥多复制一份到第二个平台 —— 成本更高、收益一样。
  #
  # ⚠️ 密钥没配时这两条会**如实失败**（报「密钥未注入」），不会静默通过。
  # ==========================================================================

  # 每 5 天探活一次。免费档的判定是「连续 7 天没有任何请求」就整个项目停机
  # （用户看到的是「打不开」，不是「有点慢」）；定时任务在高负载时可能延迟
  # 数小时、偶尔被跳过，排 5 天则跳过一次也仍在 7 天窗口内。
  # ⚠️ 探活**必须打到数据库** —— PostgREST 查询才算活动，根路径与状态页不算。
  "crontab: 0 3 */5 * *":
    - name: supabase-keepalive
      docker:
        image: node:20
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-secrets/-/blob/main/supabase.yml
      stages:
        - name: ping-db
          script: |
            set -e
            : "${SUPABASE_URL:?SUPABASE_URL 未注入，请检查密钥仓库 supabase.yml}"
            : "${SUPABASE_SERVICE_KEY:?SUPABASE_SERVICE_KEY 未注入，请检查密钥仓库 supabase.yml}"
            echo "探活：打一次真查询（不打印任何密钥，也不打印响应体）"
            # ⚠️ apikey 头必须是**密钥本身**，不是 SUPABASE_URL。
            #    原先这里写的是 `apikey: $SUPABASE_URL` —— 把一个 URL 当 key 发出去，
            #    Supabase 一律回 401。症状正好是「密钥明明注入了，探活却天天红」，
            #    于是这一条会被误读成「密钥仓库没配好」而反复去查密钥仓库。
            #    PostgREST 认两个头：apikey 给的是 key（这里用 service_role），
            #    Authorization 给的是 Bearer token —— 同一个 key 两处都要带。
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/accounts?select=uid&limit=1" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
            echo "HTTP $CODE"
            # 失败必须红：探活静默挂掉三个月，会以「某天用户突然登不上」的形式暴露
            test "$CODE" = "200"

  # 每周备份一次。免费档**没有自动备份**（无 PITR），误删就是永久消失。
  "crontab: 30 4 * * 1":
    - name: supabase-backup
      # ⚠️ 用 postgres:16 而不是 node:20 —— 后者**没有 pg_dump**。
      #    换成 postgres:16（自带 pg_dump）或自建一个预装 postgresql-client
      #    的镜像；见 docs/architecture.md §4.12 第 D 步。
      docker:
        image: postgres:16
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-secrets/-/blob/main/supabase.yml
      stages:
        - name: pg-dump
          script: |
            set -e
            : "${SUPABASE_DB_URL:?SUPABASE_DB_URL 未注入，请检查密钥仓库 supabase.yml}"
            command -v pg_dump >/dev/null 2>&1 || {
              echo "本镜像没有 pg_dump —— 见 docs/architecture.md §4.12 第 D 步";
              exit 1;
            }
            # ⚠️ pg_dump 从 URL 里**自己拆**主机名，不认 shell 的引号。密码含
            #    @ : / # ? 这类保留字符时必须百分号编码（@ → %40），否则它会把
            #    密码里那一段当成主机名，报的是：
            #      could not translate host name "…@db.<ref>.supabase.co"
            #    —— **看着像 DNS 坏了，其实只是密码没转义**。这种报错会把人
            #    引向「网络 / DNS / 项目被暂停」三条错路，所以先按 URL 形状自检。
            case "$SUPABASE_DB_URL" in
              postgres://*|postgresql://*) : ;;
              *) echo "SUPABASE_DB_URL 必须以 postgresql:// 开头（Project Settings → Database → Connection string 的模板）"; exit 1 ;;
            esac
            DB_HOST=$(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[a-z]+://[^@/]*@##; s#[:/].*$##')
            case "$DB_HOST" in
              *@*)
                echo "SUPABASE_DB_URL 的密码里含未转义的 @ —— 用户名/主机名会被拆错，"
                echo "pg_dump 于是一律报 could not translate host name（那**不是** DNS 坏了）。"
                echo "把密码里的特殊字符百分号编码后再填：@ → %40  : → %3A  / → %2F  # → %23  ? → %3F"
                exit 1
                ;;
            esac
            # ⚠️ 这个镜像的 pg_dump 是 16，而 Supabase 服务端是 17。pg_dump 比
            #    服务端**大版本低**时，会对着 17 才有的对象报
            #    "server version mismatch"（老版本读不懂新目录）。这条警告不是备份失败，
            #    但下一轮看见它别当成新 bug 去查。
            mkdir -p backup
            STAMP=$(date +%Y%m%d)
            pg_dump --no-owner --no-privileges "$SUPABASE_DB_URL" > "backup/kuibu-$STAMP.sql"
            wc -c "backup/kuibu-$STAMP.sql"
            echo "备份已生成：backup/kuibu-$STAMP.sql"

  pull_request:
    - name: pr-test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            # 必须**一条命令**同时装 jsdom 与 puppeteer。
            # 分成两条 `npm i` 时，第二条会因为 package.json 里没有声明这两个包
            # （只用 --no-save 临时装）而把第一条的成果当作「多余的包」清掉 ——
            # 实测：先装 jsdom（39 个包），再装 puppeteer 会打印
            # "added 98 packages, and removed 39 packages"，jsdom 被整个移除。
            # 之后 test/run.sh 发现 require.resolve('jsdom') 失败，转入「临时安装」分支，
            # 在另一处目录里再装一份 jsdom，依赖解析于是变得不确定
            # （小古文层曾因此在 CI 上抛出 TypeError 而整层炸掉）。
            #
            # jsdom 固定大版本：本镜像的 Node 是 20，而 jsdom 30 起把 engines
            # 提到了 ^22.22.2 || ^24.15.0 || >=26.0.0 —— 在 Node 20 上属于「未支持」，
            # 装到会上但 DOM 行为漂移（jsdom 27~29 的 element.querySelector('#dup-id')
            # 只认文书里第一枚 id，恰好把「页面顶栏与阅读器顶栏都渲染出 id="top-act"」
            # 这个真 bug 暴露成整层 ✗；上层若只跟着升 jsdom 就会让红绿随版本跳）。
            # 这里锁 ^26（engines: >=18），要升 Node 时同步放开。
            npm i jsdom@^26 puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

$:
  # 手动触发：推送到 GitHub
  web_trigger_push_github:
    - name: push-to-github
      docker:
        image: node:20
      <<: *push-to-github

  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: node scripts/serve.js
