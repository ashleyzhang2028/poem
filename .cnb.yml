# 古诗词背诵 · 静态站点
# push 到 main / PR 时自动跑测试

main:
  push:
    - name: test
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: npm i jsdom --no-save --no-fund --no-audit
        - name: run-tests
          script: ./test/run.sh

  pull_request:
    - name: pr-test
      docker:
        image: node:20
      stages:
        - name: install-deps
          script: npm i jsdom --no-save --no-fund --no-audit
        - name: run-tests
          script: ./test/run.sh

$:
  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: npx --yes http-server . -p 8080 -c-1
