# 古诗词背诵 · 静态站点（PWA）
# push 到 main / PR 时自动跑测试
# 手动触发：web_trigger 起预览服务；web_trigger_push_github 推送到 GitHub 仓库 ashleyzhang2028/poem

main:
  push:
    - name: test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            npm i jsdom --no-save --no-fund --no-audit
            npm i puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

  pull_request:
    - name: pr-test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            npm i jsdom --no-save --no-fund --no-audit
            npm i puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

$:
  # 手动触发：推送到 GitHub
  # 凭据来自密钥仓库，见下方 imports
  web_trigger_push_github:
    - name: push-to-github
      docker:
        image: node:20
      imports:
        - https://cnb.cool/npu-gpu-cpu/ashleyzhang2028-poem/-/blob/main/github.yml
      stages:
        - name: push
          script: |
            set -e
            : "${GITHUB_TOKEN:?GITHUB_TOKEN 未注入，请检查密钥仓库 github.yml}"
            USER="${GITHUB_USER:-ashleyzhang2028}"
            REPO="${GITHUB_REPO:-ashleyzhang2028/poem}"
            BRANCH="${GITHUB_BRANCH:-main}"

            git config --global user.name  "${USER}"
            git config --global user.email "${USER}@users.noreply.github.com"
            git remote remove github 2>/dev/null || true
            git remote add github "https://${USER}:${GITHUB_TOKEN}@github.com/${REPO}.git"

            echo "推送到 github.com/${REPO} 分支 ${BRANCH} ..."
            git push --force github "HEAD:${BRANCH}"
            echo "推送完成 ✅  https://github.com/${REPO}"

  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: node scripts/serve.js
