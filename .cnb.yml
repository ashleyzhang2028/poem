# 古诗词背诵 · 静态站点（PWA）
# main 分支 push / 合并后：跑测试 → 自动同步到 GitHub 仓库 ashleyzhang2028/poem
# 手动触发：web_trigger 起预览服务；web_trigger_push_github 手动推送到 GitHub

# GitHub 推送脚本（多处复用）
.push-to-github: &push-to-github
  imports:
    - https://cnb.cool/npu-gpu-cpu/ashleyzhang2028-poem/-/blob/main/github.yml
  stages:
    - name: push
      script: |
        set -e
        : "${GITHUB_TOKEN:?GITHUB_TOKEN 未注入，请检查密钥仓库 github.yml}"
        USER="${GITHUB_USER:-ashleyzhang2028}"
        REPO="${GITHUB_REPO:-ashleyzhang2028/poem}"
        BRANCH="${GITHUB_BRANCH:-main}"

        git config --global user.name  "${USER}"
        git config --global user.email "${USER}@users.noreply.github.com"
        git remote remove github 2>/dev/null || true
        git remote add github "https://${USER}:${GITHUB_TOKEN}@github.com/${REPO}.git"

        echo "推送 $(git rev-parse --short HEAD) 到 github.com/${REPO} 分支 ${BRANCH} ..."
        git push --force github "HEAD:${BRANCH}"
        echo "推送完成 ✅  https://github.com/${REPO}"

main:
  push:
    - name: test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            # 必须**一条命令**同时装 jsdom 与 puppeteer。
            # 分成两条 `npm i` 时，第二条会因为 package.json 里没有声明这两个包
            # （只用 --no-save 临时装）而把第一条的成果当作「多余的包」清掉 ——
            # 实测：先装 jsdom（39 个包），再装 puppeteer 会打印
            # "added 98 packages, and removed 39 packages"，jsdom 被整个移除。
            # 之后 test/run.sh 发现 require.resolve('jsdom') 失败，转入「临时安装」分支，
            # 在另一处目录里再装一份 jsdom，依赖解析于是变得不确定
            # （小古文层曾因此在 CI 上抛出 TypeError 而整层炸掉）。
            npm i jsdom puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

    # 合并进 main 后自动同步 GitHub，无需再手动点按钮
    - name: sync-to-github
      docker:
        image: node:20
      <<: *push-to-github

  pull_request:
    - name: pr-test
      docker:
        build: image/Dockerfile
      stages:
        - name: install-deps
          script: |
            set -e
            # 必须**一条命令**同时装 jsdom 与 puppeteer。
            # 分成两条 `npm i` 时，第二条会因为 package.json 里没有声明这两个包
            # （只用 --no-save 临时装）而把第一条的成果当作「多余的包」清掉 ——
            # 实测：先装 jsdom（39 个包），再装 puppeteer 会打印
            # "added 98 packages, and removed 39 packages"，jsdom 被整个移除。
            # 之后 test/run.sh 发现 require.resolve('jsdom') 失败，转入「临时安装」分支，
            # 在另一处目录里再装一份 jsdom，依赖解析于是变得不确定
            # （小古文层曾因此在 CI 上抛出 TypeError 而整层炸掉）。
            npm i jsdom puppeteer --no-save --no-fund --no-audit
        - name: run-tests
          script: bash test/run.sh

$:
  # 手动触发：推送到 GitHub
  web_trigger_push_github:
    - name: push-to-github
      docker:
        image: node:20
      <<: *push-to-github

  web_trigger:
    - name: preview
      docker:
        image: node:20
      stages:
        - name: serve
          script: node scripts/serve.js
