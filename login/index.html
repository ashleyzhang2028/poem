<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>登录 · 跬步</title>
  <meta name="description" content="跬步登录：邮箱注册、邮箱确认、密码登录、忘记密码重设，以及不记密码的随机码快捷登录。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VEFD6BLJV5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VEFD6BLJV5');
  </script>
</head>

<body data-nav="login" data-dock="off" data-back="/mine/" data-page="登录" data-sub="邮箱登录或注册">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="login-page">
      <section class="account-card">

        <div id="trust-panel" hidden>
          <button class="account-btn" id="btn-trust" type="button"></button>
          <button class="account-btn ghost" id="btn-trust-other" type="button">使用其他邮箱</button>
          <p class="account-hint">30 天内在这台设备上免验证登录。</p>
        </div>

        <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="登录方式">
          <button class="auth-tab" id="tab-pw" type="button" role="tab"
                  aria-selected="true" aria-controls="pane-pw" data-pane="pw">密码登录</button>
          <button class="auth-tab" id="tab-code" type="button" role="tab"
                  aria-selected="false" aria-controls="pane-code" data-pane="code">验证码登录</button>
        </div>

        <div class="auth-pane" id="pane-pw" role="tabpanel" aria-labelledby="tab-pw">
          <div class="account-field">
            <label class="account-label" for="input-pw-email"><span class="sr-only">邮箱</span></label>
            <input id="input-pw-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="next"
                   placeholder="邮箱" maxlength="120" aria-label="邮箱" />
          </div>
          <div class="account-field">
            <label class="account-label" for="input-pw"><span class="sr-only">密码</span></label>
            <div class="pw-row">
              <input id="input-pw" class="account-input" type="password"
                     autocomplete="current-password" spellcheck="false" enterkeyhint="go"
                     placeholder="密码" maxlength="72" aria-label="密码" />
              <button class="pw-eye" id="btn-pw-eye" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>

          <div class="turnstile-slot" id="ts-pw" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-pw" hidden></div>
          <button class="account-btn" id="btn-login" type="button">登录</button>
          <p class="account-msg" id="msg-pw"></p>

          <p class="auth-links">
            <button class="link-btn" id="btn-go-register" type="button">还没有账号？注册</button>
            <span class="link-sep">·</span>
            <button class="link-btn" id="btn-forgot" type="button">忘记密码</button>
          </p>
        </div>

        <div class="auth-pane" id="pane-code" role="tabpanel" aria-labelledby="tab-code" hidden>
          <div class="account-step" id="step-email">
            <div class="account-field">
              <label class="account-label" for="input-email"><span class="sr-only">邮箱</span></label>
              <input id="input-email" class="account-input" type="email" inputmode="email"
                     autocomplete="email" spellcheck="false" enterkeyhint="send"
                     placeholder="邮箱" maxlength="120" aria-label="邮箱" />
            </div>
            <div class="turnstile-slot" id="ts-code" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-code" hidden></div>
            <button class="account-btn" id="btn-send" type="button">发送验证码</button>
            <p class="account-msg" id="msg-email"></p>

          </div>

          <div class="account-step" id="step-code" hidden>
            <p class="account-lead" id="code-sent-to"></p>
            <div class="code-row" id="code-row" role="group" aria-label="请输入 6 位验证码"></div>
            <div class="code-meta">
              <span id="code-timer"></span>
              <button class="code-resend" id="btn-resend" type="button">重新发送</button>
            </div>
            <div class="turnstile-slot" id="ts-code-resend" hidden></div>
            <div class="account-note warn" id="ts-broken-ts-code-resend" hidden></div>
            <button class="account-btn" id="btn-verify" type="button">验证并登录</button>
            <button class="account-btn ghost" id="btn-edit-email" type="button">换个邮箱</button>
            <p class="account-msg" id="msg-code"></p>

            <div class="account-note" id="remote-note" hidden>
              登录即表示同意<a class="kv-link" href="/terms/">用户协议</a>与<a class="kv-link" href="/privacy/">隐私条款</a>。
            </div>

            <div class="account-note" id="local-note" hidden>
              <strong>本地体验版</strong>：本应用没有服务器，随机码由这台设备生成，自己保管，别转给别人。
            </div>
            <div class="account-field code-tools" id="code-tools">
              <button class="account-btn ghost" id="btn-copy-code" type="button">复制验证码</button>
              <button class="account-btn ghost" id="btn-mail-code" type="button">用邮箱客户端发送</button>
            </div>
          </div>
        </div>

        <div class="auth-pane" id="pane-register" role="tabpanel" hidden>
          <h2 class="auth-title">注册账号</h2>
          <div class="account-field">
            <label class="account-label" for="input-reg-email"><span class="sr-only">邮箱</span></label>
            <input id="input-reg-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="next"
                   placeholder="邮箱" maxlength="120" aria-label="邮箱" />
          </div>
          <div class="account-field">
            <label class="account-label" for="input-reg-pw"><span class="sr-only">密码</span></label>
            <div class="pw-row">
              <input id="input-reg-pw" class="account-input" type="password"
                     autocomplete="new-password" spellcheck="false" enterkeyhint="next"
                     placeholder="密码（至少 8 位）" maxlength="72" aria-label="密码" />
              <button class="pw-eye" id="btn-reg-eye" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>
          <div class="account-field">
            <label class="account-label" for="input-reg-pw2"><span class="sr-only">确认密码</span></label>
            <div class="pw-row">
              <input id="input-reg-pw2" class="account-input" type="password"
                     autocomplete="new-password" spellcheck="false" enterkeyhint="go"
                     placeholder="确认密码" maxlength="72" aria-label="确认密码" />
              <button class="pw-eye" id="btn-reg-eye2" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>
          <div class="turnstile-slot" id="ts-reg" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-reg" hidden></div>
          <button class="account-btn" id="btn-register" type="button">注册</button>

          <button class="account-btn ghost" id="btn-reg-refresh" type="button" hidden aria-hidden="true">刷新页面重试</button>
          <p class="account-msg" id="msg-reg"></p>

          <p class="account-hint">注册后请查收验证邮件，<strong>点击链接验证后登录</strong>。链接 24 小时内有效。</p>
          <p class="auth-links">已有账号？<button class="link-btn" id="btn-back-login" type="button">登录</button></p>
        </div>

        <div class="auth-pane" id="pane-verify" role="tabpanel" hidden>
          <h2 class="auth-title">验证邮箱</h2>
          <p class="account-lead" id="verify-lead"></p>
          <div class="account-note" id="verify-fail-note" hidden></div>
          <div class="account-field">
            <label class="account-label" for="input-verify-email"><span class="sr-only">邮箱</span></label>
            <input id="input-verify-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="send"
                   placeholder="邮箱" maxlength="120" aria-label="邮箱" />
          </div>
          <div class="turnstile-slot" id="ts-verify" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-verify" hidden></div>
          <button class="account-btn" id="btn-resend-verify" type="button">重发验证邮件</button>

          <button class="account-btn ghost" id="btn-verify-later" type="button">返回登录</button>
          <p class="account-msg" id="msg-verify"></p>

          <p class="account-hint">链接 24 小时内有效，点击后即完成验证并登录。</p>
        </div>

        <div class="auth-pane" id="pane-forgot" role="tabpanel" hidden>
          <h2 class="auth-title">找回密码</h2>
          <p class="account-lead">输入注册邮箱，我们将发送重设密码的链接。</p>
          <div class="account-field">
            <label class="account-label" for="input-forgot-email"><span class="sr-only">邮箱</span></label>
            <input id="input-forgot-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="send"
                   placeholder="邮箱" maxlength="120" aria-label="邮箱" />
          </div>
          <div class="turnstile-slot" id="ts-forgot" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-forgot" hidden></div>
          <button class="account-btn" id="btn-forgot-send" type="button">发送重设邮件</button>
          <p class="account-msg" id="msg-forgot"></p>

          <p class="account-hint">没收到？请检查垃圾邮件，或改用验证码登录。</p>
          <p class="auth-links"><button class="link-btn" id="btn-back-login2" type="button">返回登录</button></p>
        </div>

        <div class="account-step" id="step-unverified" hidden>
          <h2 class="auth-title">邮箱尚未验证</h2>
          <p class="account-lead" id="unverified-lead"></p>
          <div class="account-note" id="unverified-note" hidden></div>
          <div class="turnstile-slot" id="ts-unverified" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-unverified" hidden></div>
          <button class="account-btn" id="btn-unverified-resend" type="button">重新发送验证邮件</button>
          <button class="account-btn ghost" id="btn-unverified-back" type="button">返回登录</button>
          <p class="account-msg" id="msg-unverified"></p>
          <p class="account-hint">完成邮箱验证后才能登录，背诵功能不受影响。</p>
        </div>

        <div class="account-step" id="step-done" hidden>
          <h2 class="auth-title">欢迎加入</h2>
          <p class="account-lead" id="done-lead"></p>
          <div class="account-field">
            <label class="account-label" for="input-nickname"><span class="sr-only">昵称（可留空）</span></label>
            <input id="input-nickname" class="account-input" type="text" maxlength="12"
                   autocomplete="off" enterkeyhint="done" placeholder="昵称（可留空）" aria-label="昵称（可留空）" />
          </div>
          <button class="account-btn" id="btn-finish" type="button">完成</button>
          <p class="account-msg" id="msg-done"></p>
          <div class="account-note warn" id="done-note" hidden></div>
          <p class="account-hint">建议只填小名。昵称随账号同步，之后可在「我的」中修改。</p>
        </div>
      </section>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>

  <script src="/js/turnstile.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/data/text-master.js"></script>
  <script src="/data/index.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
