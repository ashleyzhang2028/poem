<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>登录 · 跬步</title>
  <meta name="description" content="跬步登录：邮箱注册、邮箱确认、密码登录、忘记密码重设，以及不记密码的随机码快捷登录。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>

<body data-nav="login" data-dock="off" data-back="/profile/" data-page="登录" data-sub="邮箱 · 密码 · 随机码">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="login-page">
      <section class="account-card">

        <div id="trust-panel" hidden>
          <button class="account-btn" id="btn-trust" type="button"></button>
          <button class="account-btn ghost" id="btn-trust-other" type="button">用别的邮箱</button>
          <p class="account-hint">信任期 30 天。换设备或换邮箱，点上面那颗。</p>
        </div>

        <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="登录方式">
          <button class="auth-tab" id="tab-pw" type="button" role="tab"
                  aria-selected="true" aria-controls="pane-pw" data-pane="pw">密码登录</button>
          <button class="auth-tab" id="tab-code" type="button" role="tab"
                  aria-selected="false" aria-controls="pane-code" data-pane="code">快捷登录</button>
        </div>

        <div class="auth-pane" id="pane-pw" role="tabpanel" aria-labelledby="tab-pw">
          <div class="account-field">
            <label class="account-label" for="input-pw-email">邮箱</label>
            <input id="input-pw-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="next"
                   placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="account-field">
            <label class="account-label" for="input-pw">密码</label>
            <div class="pw-row">
              <input id="input-pw" class="account-input" type="password"
                     autocomplete="current-password" spellcheck="false" enterkeyhint="go"
                     placeholder="至少 8 位" maxlength="72" />
              <button class="pw-eye" id="btn-pw-eye" type="button" aria-label="显示密码">显示</button>
            </div>
          </div>

          <div class="turnstile-slot" id="ts-pw" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-pw" hidden></div>
          <button class="account-btn" id="btn-login" type="button">登录</button>
          <p class="account-msg" id="msg-pw"></p>

          <p class="auth-links">
            <button class="link-btn" id="btn-go-register" type="button">还没有账号？注册</button>
            <span class="link-sep">·</span>
            <button class="link-btn" id="btn-forgot" type="button">忘记密码</button>
          </p>
        </div>

        <div class="auth-pane" id="pane-code" role="tabpanel" aria-labelledby="tab-code" hidden>
          <div class="account-step" id="step-email">
            <div class="account-field">
              <label class="account-label" for="input-email">邮箱</label>
              <input id="input-email" class="account-input" type="email" inputmode="email"
                     autocomplete="email" spellcheck="false" enterkeyhint="send"
                     placeholder="you@example.com" maxlength="120" />
            </div>
            <div class="turnstile-slot" id="ts-code" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-code" hidden></div>
            <button class="account-btn" id="btn-send" type="button">发送随机码</button>
            <p class="account-msg" id="msg-email"></p>

          </div>

          <div class="account-step" id="step-code" hidden>
            <p class="account-lead" id="code-sent-to"></p>
            <div class="code-row" id="code-row"></div>
            <div class="code-meta">
              <span id="code-timer"></span>
              <button class="code-resend" id="btn-resend" type="button">重新发送</button>
            </div>
            <button class="account-btn" id="btn-verify" type="button">确定</button>
            <button class="account-btn ghost" id="btn-edit-email" type="button">换个邮箱</button>
            <p class="account-msg" id="msg-code"></p>

            <div class="account-note" id="remote-note" hidden>
              进度会保存到服务器以便跨设备同步。点「确定」即表示同意；可在「设置 · 通用」关掉。
            </div>

            <div class="account-note" id="local-note" hidden>
              <strong>本地体验版</strong>：本应用没有服务器，随机码由这台设备生成，自己保管，别转给别人。
            </div>
            <div class="account-field" id="code-tools" style="margin-top:10px">
              <button class="account-btn ghost" id="btn-copy-code" type="button">复制随机码</button>
              <button class="account-btn ghost" id="btn-mail-code" type="button">用邮箱客户端发送</button>
            </div>
          </div>
        </div>

        <div class="auth-pane" id="pane-register" role="tabpanel" hidden>
          <div class="account-field">
            <label class="account-label" for="input-reg-email">邮箱</label>
            <input id="input-reg-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="next"
                   placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="account-field">
            <label class="account-label" for="input-reg-pw">密码</label>
            <div class="pw-row">
              <input id="input-reg-pw" class="account-input" type="password"
                     autocomplete="new-password" spellcheck="false" enterkeyhint="next"
                     placeholder="至少 8 位" maxlength="72" />
              <button class="pw-eye" id="btn-reg-eye" type="button" aria-label="显示密码">显示</button>
            </div>
          </div>
          <div class="account-field">
            <label class="account-label" for="input-reg-pw2">再填一次密码</label>
            <input id="input-reg-pw2" class="account-input" type="password"
                   autocomplete="new-password" spellcheck="false" enterkeyhint="go"
                   placeholder="两次要一样" maxlength="72" />
          </div>
          <div class="turnstile-slot" id="ts-reg" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-reg" hidden></div>
          <button class="account-btn" id="btn-register" type="button">注册</button>
          <p class="account-msg" id="msg-reg"></p>

          <p class="account-hint">注册后我们会发一封确认邮件，<strong>点开链接确认后才能登录</strong>。链接 24 小时内有效。</p>
          <p class="auth-links"><button class="link-btn" id="btn-back-login" type="button">返回登录</button></p>
        </div>

        <div class="auth-pane" id="pane-verify" role="tabpanel" hidden>
          <p class="account-lead" id="verify-lead"></p>
          <div class="account-note" id="verify-fail-note" hidden></div>
          <div class="account-field">
            <label class="account-label" for="input-verify-email">邮箱（没登录也能重发）</label>
            <input id="input-verify-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="send"
                   placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="turnstile-slot" id="ts-verify" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-verify" hidden></div>
          <button class="account-btn" id="btn-resend-verify" type="button">重发确认邮件</button>

          <button class="account-btn ghost" id="btn-verify-later" type="button">返回登录</button>
          <p class="account-msg" id="msg-verify"></p>

          <p class="account-hint">链接 24 小时内有效，没收到就点上面那颗重发。</p>
          <p class="auth-links"><button class="link-btn" id="btn-back-login3" type="button">返回登录</button></p>
        </div>

        <div class="auth-pane" id="pane-forgot" role="tabpanel" hidden>
          <p class="account-lead">填注册时的邮箱，我们发一条重设链接。</p>
          <div class="account-field">
            <label class="account-label" for="input-forgot-email">邮箱</label>
            <input id="input-forgot-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="send"
                   placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="turnstile-slot" id="ts-forgot" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-forgot" hidden></div>
          <button class="account-btn" id="btn-forgot-send" type="button">发送重设邮件</button>
          <p class="account-msg" id="msg-forgot"></p>

          <p class="account-hint">没收到先看垃圾邮件；或改用「快捷登录」的随机码。</p>
          <p class="account-hint">邮箱未确认的重设也登不进去 —— 先去登录页点「重新发一封确认邮件」。</p>
          <p class="auth-links"><button class="link-btn" id="btn-back-login2" type="button">返回登录</button></p>
        </div>

        <div class="account-step" id="step-unverified" hidden>
          <p class="account-lead" id="unverified-lead"></p>
          <div class="account-note" id="unverified-note" hidden></div>
          <div class="turnstile-slot" id="ts-unverified" hidden></div>
          <div class="account-note warn" id="ts-broken-ts-unverified" hidden></div>
          <button class="account-btn" id="btn-unverified-resend" type="button">重新发一封确认邮件</button>
          <button class="account-btn ghost" id="btn-unverified-back" type="button">返回登录</button>
          <p class="account-msg" id="msg-unverified"></p>
          <p class="account-hint">确认前只有云端登录被拦，背诵功能照旧可用。</p>
        </div>

        <div class="account-step" id="step-done" hidden>
          <p class="account-lead" id="done-lead"></p>
          <div class="account-field">
            <label class="account-label" for="input-nickname">昵称（可留空）</label>
            <input id="input-nickname" class="account-input" type="text" maxlength="12"
                   autocomplete="off" enterkeyhint="done" placeholder="Ashley" />
          </div>
          <button class="account-btn" id="btn-finish" type="button">完成</button>
          <p class="account-hint">请只填小名。</p>
        </div>
      </section>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>

  <script src="/js/turnstile.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/data/text-master.js"></script>
  <script src="/data/index.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
