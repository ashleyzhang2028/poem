<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>登录 · 跬步</title>
  <meta name="description" content="跬步登录：不注册也能用全部功能；用邮箱随机码建一个只存在本机的账号，让背诵进度不因清缓存而丢失。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<!-- data-dock="off"：登录页是一段「专心做完」的流程，不留底部页签免得误触跳走
     （法务页同款）。
     返回落点（Issue #132 · D）指**个人中心**而不是设置页：
     进来的人有两种 —— 一种从设置主页那张「账号」卡（未登录时才出现），
     另一种从个人中心（首页那枚印 → /profile/ → 这颗入口）进来。
     前者占少数，后者才是主要动线；而且「点账号 → 看自己是谁」比
     「点账号 → 落回一页设置」更符合上一轮定下的说法：
     登录是身份的事，落回设置页等于又多绕一层。 -->
<body data-nav="login" data-dock="off" data-back="/profile/" data-page="登录" data-sub="邮箱随机码">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="login-page">
      <!-- ==================================================================
           登录 / 注册（Issue #132 · A→B→C→D 的 B）
           ------------------------------------------------------------------
           注册与登录是**同一个动作**：输邮箱 → 收码 → 填码。
           该邮箱没有账号就建号，有就登录 —— 用户不需要理解自己在做哪一件。

           ⚠️ 本期没有服务端，所以这里如实标注「本地体验版」：
              码由本机生成，靠用户自己复制或走 mailto 带回填。
              **绝不许把它宣传成「邮件认证已经做好了」**
              （docs/auth-design.md §7.1 白纸黑字写着这一条）。
           ⚠️ 三步同屏递进、不跳页：跳页会丢状态，而状态机是「不可跳步」的。
           ================================================================== -->
      <section class="account-card">

        <!-- ---------- 信任期：信任期内一点即入，不发码 ---------- -->
        <div id="trust-panel" hidden>
          <button class="account-btn" id="btn-trust" type="button"></button>
          <button class="account-btn ghost" id="btn-trust-other" type="button">用别的邮箱</button>
          <p class="account-hint">信任期 30 天。换设备或换邮箱，点上面那颗。</p>
        </div>

        <!-- ---------- ① 输邮箱 ---------- -->
        <div class="account-step" id="step-email">
          <div class="account-field">
            <label class="account-label" for="input-email">邮箱</label>
            <input id="input-email" class="account-input" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" enterkeyhint="send"
                   placeholder="you@example.com" maxlength="120" />
          </div>
          <button class="account-btn" id="btn-send" type="button">发送随机码</button>
          <p class="account-msg" id="msg-email"></p>
        </div>

        <!-- ---------- ② 收码回填 ---------- -->
        <div class="account-step" id="step-code" hidden>
          <p class="account-lead" id="code-sent-to"></p>
          <div class="code-row" id="code-row"></div>
          <div class="code-meta">
            <span id="code-timer"></span>
            <button class="code-resend" id="btn-resend" type="button">重新发送</button>
          </div>
          <button class="account-btn" id="btn-verify" type="button">确定</button>
          <button class="account-btn ghost" id="btn-edit-email" type="button">换个邮箱</button>
          <p class="account-msg" id="msg-code"></p>

          <!-- 云端同步的据实告知（docs/architecture.md §4.2）
               ------------------------------------------------------------------
               ⚠️ 不是「出境同意」，也**不做单独勾选框**：上传就要求知情同意，
                  与机房在哪个国家无关。说清一件事、点「确定」即视为同意。
               ⚠️ 这一段**默认隐藏**，只有在真的走服务端时（state.remote）才显示 ——
                  本机体验版下摆一句「进度会上传到服务器」是假的。 -->
          <div class="account-note" id="remote-note" hidden>
            进度会保存到服务器以便跨设备同步。点「确定」即表示同意；可在「设置 · 通用」关掉。
          </div>

          <!-- 本地体验版的说明：必须显眼，不许含糊 -->
          <div class="account-note" id="local-note" hidden>
            <strong>本地体验版</strong>：本应用没有服务器，随机码由这台设备生成，自己保管，别转给别人。
          </div>
          <div class="account-field" id="code-tools" style="margin-top:10px">
            <button class="account-btn ghost" id="btn-copy-code" type="button">复制随机码</button>
            <button class="account-btn ghost" id="btn-mail-code" type="button">用邮箱客户端发送</button>
          </div>
        </div>

        <!-- ---------- ③ 登录后：补昵称 ---------- -->
        <div class="account-step" id="step-done" hidden>
          <p class="account-lead" id="done-lead"></p>
          <div class="account-field">
            <label class="account-label" for="input-nickname">昵称（可留空）</label>
            <input id="input-nickname" class="account-input" type="text" maxlength="12"
                   autocomplete="off" enterkeyhint="done" placeholder="Ashley" />
          </div>
          <button class="account-btn" id="btn-finish" type="button">完成</button>
          <p class="account-hint">请只填小名。</p>
        </div>
      </section>

      <!-- ==================================================================
           短信通道的占位（**2B：口子已接好，界面仍不渲染**）
           ------------------------------------------------------------------
           2B 之前，短信只是「identity.channel 里有个 "sms"」这一句注释。
           2B 之后，**服务端与客户端都已经真的支持 channel:"sms"**：
             · 服务端 normIdentity 认 sms，走独立的手机号归一化与摘要命名空间
             · 频控有更严的 SMS 档（60 秒 1 次、日 5 次、月 15 次，§8）
             · 没有开通时**如实回 503 E_SMS_NOT_OPEN**，绝不假装发了短信
           所以将来「开通」这一步，真的只是把下面这颗按钮取消注释 ——
           不再是「先设计一遍、再实现一遍」。
           ⚠️ 但**按钮现在不渲染**，也不许提前写「短信登录即将上线」：
              界面与条款都不许跑在代码前面（§12 的总原则）；
              而「接口支持」不等于「通道能用」（还没签短信商）。
           ⚠️ 开通后才允许取消注释，且必须同时：配 SMS_ENABLED=1 + SMS_TRANSPORT，
              以及前置人机校验（图形/滑块）—— 短信接口是黑产重点目标（§8）。
           ================================================================== -->
      <!-- <button class="account-btn ghost" data-channel="sms">用手机号登录</button> -->
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 脚本顺序：auth-core（内核）→ entitlement（权益）→ avatar（印）→ login（本页）→ chrome（顶栏）→ pwa -->
  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/data/text-master.js"></script>
  <script src="/data/index.js"></script>
  <!-- 子档案（Issue #159）：名册 + 当前选中项 + 键映射的唯一一处实现。
       这一页不加载 js/progress-store.js（没有进度读写），但 profiles.js
       要排在 avatar.js 之前 —— 顶栏那枚印的昵称与字取自当前子档案。 -->
  <script src="/js/profiles.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
