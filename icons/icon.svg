<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fdfaf2"/>
      <stop offset="1" stop-color="#f2e9d6"/>
    </linearGradient>
    <linearGradient id="celadon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d8c83"/>
      <stop offset="0.5" stop-color="#4d7d74"/>
      <stop offset="1" stop-color="#37605a"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8564a"/>
      <stop offset="1" stop-color="#a83b32"/>
    </linearGradient>
  </defs>

  <!-- 宣纸底 -->
  <rect width="512" height="512" rx="116" fill="url(#paper)"/>
  <!-- 内界行：宋代刻本的双边栏 -->
  <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="#d9b566" stroke-opacity="0.55" stroke-width="5"/>

  <!-- 圆窗：雨过天青 -->
  <circle cx="246" cy="240" r="150" fill="url(#celadon)"/>
  <circle cx="246" cy="240" r="150" fill="none" stroke="#d9b566" stroke-opacity="0.5" stroke-width="4"/>

  <!-- 「诗」字：矢量笔画，不依赖字体 -->
  <g transform="translate(3,5)" stroke="#33574f" stroke-opacity="0.22" fill="#33574f" fill-opacity="0.22" stroke-linecap="round" stroke-linejoin="round">
    <!-- 讠 点 -->
    <circle cx="157" cy="172" r="12" stroke="none"/>
    <!-- 讠 横折提 -->
    <path d="M152 216 h40 M192 216 v24 l-48 28" fill="none" stroke-width="17"/>
    <!-- 寺 上 土 -->
    <path d="M214 178 h116" fill="none" stroke-width="19"/>
    <path d="M272 148 v92" fill="none" stroke-width="19"/>
    <path d="M226 240 h118" fill="none" stroke-width="19"/>
    <!-- 寺 下 寸 -->
    <path d="M214 296 h124" fill="none" stroke-width="19"/>
    <path d="M296 268 v88 q0 36 -36 46" fill="none" stroke-width="19"/>
    <circle cx="200" cy="322" r="15" stroke="none"/>
  </g>

  <!-- 「诗」字：矢量笔画，不依赖字体 -->
  <g stroke="#fbf6e9" fill="#fbf6e9" stroke-linecap="round" stroke-linejoin="round">
    <!-- 讠 点 -->
    <circle cx="157" cy="172" r="12" stroke="none"/>
    <!-- 讠 横折提 -->
    <path d="M152 216 h40 M192 216 v24 l-48 28" fill="none" stroke-width="17"/>
    <!-- 寺 上 土 -->
    <path d="M214 178 h116" fill="none" stroke-width="19"/>
    <path d="M272 148 v92" fill="none" stroke-width="19"/>
    <path d="M226 240 h118" fill="none" stroke-width="19"/>
    <!-- 寺 下 寸 -->
    <path d="M214 296 h124" fill="none" stroke-width="19"/>
    <path d="M296 268 v88 q0 36 -36 46" fill="none" stroke-width="19"/>
    <circle cx="200" cy="322" r="15" stroke="none"/>
  </g>

  <!-- 朱砂印：右下角小方印 -->
  <rect x="374" y="374" width="94" height="94" rx="16" fill="url(#seal)"/>
  <g stroke="#fdfaf2" fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M396 400 h50 M396 424 h50 M396 448 h50 M421 400 v48"/>
  </g>
</svg>
