<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>确认邮箱 · 跬步</title>
  <meta name="description" content="跬步账号的邮箱确认页：点开邮件里那条链接，在这里完成确认。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<!-- data-dock="off"：这是一段「做完就走」的流程（与登录页同款）。
     返回落点指 /login/ —— 用户确认完邮箱最可能的下一件事就是去登录。
     ==================================================================
     为什么确认邮箱要有**独立一页**，而不是塞进登录页
     ------------------------------------------------------------------
     邮件里那条链接点开时，用户可能压根没在登录页（在另一台设备、
     在另一个 App 里）。把处理逻辑挂在登录页上的话，
     点开链接只会落到一个「空白的登录页」，用户完全不知道发生了什么。
     独立一页恰好一件事：读出 URL 里的 vid + token，确认，说清结果。 -->
<body data-nav="verify" data-dock="off" data-back="/login/" data-page="确认邮箱" data-sub="邮件里的那条链接">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="verify-page">
      <section class="account-card">
        <!-- 三种状态各占一块，由 js/verify.js 逐个显示：
             none = URL 里没带齐参数（多半是用户手抄了一半）
             busy = 正在确认
             ok   = 成了
             bad  = 没成（过期 / 用过 / 不对）—— 结果文案由**服务端**给 -->
        <div id="verify-none" hidden>
          <p class="account-lead">这条链接不完整。</p>
          <p class="account-hint">请直接点邮件里那颗按钮，或者把整条链接完整地打开一次。</p>
          <div class="account-actions">
            <button class="account-btn" id="btn-verify-to-login" type="button">去登录</button>
          </div>
        </div>

        <div id="verify-busy">
          <p class="account-lead">正在确认…</p>
        </div>

        <div id="verify-ok" hidden>
          <p class="account-lead" id="verify-ok-lead"></p>
          <p class="account-hint">确认之后，忘记密码时就能用它重设密码了。</p>
          <div class="account-actions">
            <button class="account-btn" id="btn-verify-login" type="button">去登录</button>
          </div>
        </div>

        <div id="verify-bad" hidden>
          <p class="account-lead" id="verify-bad-lead"></p>
          <p class="account-hint">确认链接 24 小时内有效、且只能用一次。登录之后可以在「个人中心」里重发一封。</p>
          <div class="account-actions">
            <button class="account-btn" id="btn-verify-retry-login" type="button">去登录</button>
          </div>
        </div>

        <p class="account-msg" id="msg-verify"></p>
      </section>
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/verify.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
