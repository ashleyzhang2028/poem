<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>确认邮箱 · 跬步</title>
  <meta name="description" content="跬步账号的邮箱确认页：点开邮件里那条链接，在这里完成确认。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>

<body data-nav="verify" data-dock="off" data-back="/login/" data-page="确认邮箱" data-sub="邮件里的那条链接（点一下就登录）">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="verify-page">
      <section class="account-card">

        <div id="verify-none" hidden>
          <p class="account-lead">这条链接不完整。</p>
          <p class="account-hint">请直接点邮件里那颗按钮，或者把整条链接完整地打开一次。</p>
          <div class="account-actions">
            <button class="account-btn" id="btn-verify-to-login" type="button">去登录</button>
          </div>
        </div>

        <div id="verify-busy">
          <p class="account-lead">正在确认…</p>
        </div>

        <div id="verify-ok" hidden>
          <p class="account-lead" id="verify-ok-lead"></p>

          <p class="account-hint" id="verify-ok-hint"></p>
          <div class="account-actions">
            <button class="account-btn" id="btn-verify-login" type="button">开始背诵</button>
          </div>
        </div>

        <div id="verify-bad" hidden>
          <p class="account-lead" id="verify-bad-lead"></p>
          <p class="account-hint">确认链接 24 小时内有效、且只能用一次。登录之后可以在「个人中心」里重发一封。</p>
          <div class="account-actions">
            <button class="account-btn" id="btn-verify-retry-login" type="button">去登录</button>
          </div>
        </div>

        <p class="account-msg" id="msg-verify"></p>
      </section>
    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/verify.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
