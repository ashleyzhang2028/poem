<body data-nav="mine" data-page="我的" data-sub="头像 · 昵称 · 账号 · 本机数据" data-top-action="settings">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="mine-page">
      <section class="account-card">

        <div class="identity-row" id="identity-row"></div>

        <input id="avatar-file" class="sr-only" type="file" accept="image/*"
               aria-label="选择头像图片" />

        <div class="crop-layer" id="crop-layer" hidden>
          <div class="crop-card" role="dialog" aria-modal="true" aria-label="裁切头像">
            <div class="crop-box" id="crop-box">
              <img class="crop-img" id="crop-img" alt="" />
              <span class="crop-grid" aria-hidden="true"></span>
            </div>
            <input class="crop-zoom" id="crop-zoom" type="range" min="0" max="1"
                   step="0.01" value="0" aria-label="放大缩小" />
            <div class="crop-btns">
              <button class="btn ghost-btn" id="btn-crop-cancel" type="button">取消</button>

              <button class="btn ghost-btn" id="btn-crop-clear" type="button">删除头像</button>
              <button class="btn" id="btn-crop-ok" type="button">用这张</button>
            </div>
          </div>
        </div>

        <div id="verify-row" hidden>
          <p class="account-msg" id="verify-state"></p>
          <div class="settings-btns">
            <button class="account-btn ghost" id="btn-resend-verify" type="button">重发确认邮件</button>
          </div>
        </div>

      </section>

      <section class="account-card" id="family-item">
        <h2 class="account-card-title">子用户</h2>
        <div class="family-panel" id="family-panel"></div>
        <p class="settings-hint" id="family-hint"></p>
      </section>

      <section class="account-card" id="stats-card">
        <h2 class="account-card-title">本机数据</h2>
        <div class="kv-list" id="stats-list"></div>
        <div class="kv-list nav-list">
          <a class="kv-row nav-row" id="link-progress" href="/progress/"><span class="kv-k">背诵进度</span><span class="nav-go" aria-hidden="true">›</span></a>
        </div>
      </section>

      <section class="account-card" id="sync-card">
        <label class="switch sync-row" id="sync-row">
          <span class="settings-label" id="sync-name">跨设备同步</span>
          <input id="toggle-sync" class="switch-input" type="checkbox"
                 role="switch" aria-labelledby="sync-name" />
          <span class="switch-toggle" aria-hidden="true"></span>
        </label>

        <div id="sync-conflict" hidden>
          <p class="account-hint" id="conflict-lead"></p>
          <div class="settings-btns">
            <button class="account-btn" id="btn-keep-local" type="button">保留本机</button>
            <button class="account-btn ghost" id="btn-keep-remote" type="button">保留云端</button>
            <button class="account-btn ghost" id="btn-export-first" type="button">导出备份</button>
          </div>
          <p class="account-msg" id="msg-conflict"></p>
        </div>
      </section>

      <section class="account-card" id="about-card">
        <h2 class="account-card-title">更多</h2>
        <div class="kv-list nav-list">
          <a class="kv-row nav-row" href="/settings/"><span class="kv-k">设置</span><span class="nav-go" aria-hidden="true">›</span></a>
          <a class="kv-row nav-row" href="/settings/reports/"><span class="kv-k">我的报告<span class="nav-dot" id="dot-reports" hidden></span></span><span class="nav-go" aria-hidden="true">›</span></a>
          <a class="kv-row nav-row" href="/settings/feedback/"><span class="kv-k">意见反馈<span class="nav-dot" id="dot-feedback" hidden></span></span><span class="nav-go" aria-hidden="true">›</span></a>
          <a class="kv-row nav-row" id="btn-go-admin" href="/admin/" hidden><span class="kv-k">管理后台</span><span class="nav-go" aria-hidden="true">›</span></a>
        </div>
      </section>

      <div class="bottom-actions" id="bottom-actions" hidden>
        <button class="account-btn danger" id="btn-delete-start" type="button" hidden>注销账号</button>
      </div>

      <div class="danger-panel" id="danger-panel" hidden>
        <div id="delete-step-1" hidden>
          <p class="account-lead">
            注销将删除账号及云端进度，删除前会导出一份供你留存；<strong>本机背诵进度不受影响</strong>。如需同时清空本机数据，请前往<a class="kv-link" href="/settings/general/">设置 · 通用</a>。
          </p>
          <button class="account-btn danger" id="btn-delete-ask" type="button">继续注销</button>
        </div>
        <div id="delete-step-2" hidden>
          <div class="account-field">
            <label class="account-label" for="input-delete-email">请输入账号邮箱以确认注销</label>
            <input id="input-delete-email" class="account-input" type="email" inputmode="email"
                   autocomplete="off" spellcheck="false" placeholder="请输入账号邮箱以确认" maxlength="120" />
          </div>
          <div class="confirm-row">
            <button class="account-btn danger" id="btn-delete-confirm" type="button">确认注销</button>
            <button class="account-btn ghost" id="btn-delete-cancel" type="button">取消</button>
          </div>
          <p class="account-msg" id="msg-delete"></p>

          <div id="delete-export" hidden>
            <button class="account-btn ghost" id="btn-delete-export" type="button">下载云端数据备份</button>
            <p class="account-hint">这是注销前从服务器导出的数据，服务器上已不再保留，请妥善保存。</p>
          </div>
        </div>
      </div>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>

  <script src="/js/family.js"></script>

  <script src="js/read-sync.js"></script>
  <script src="js/sync-store.js"></script>
  <script src="/js/storage.js"></script>

  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>

  <script src="/data/works-index.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/avatar-image.js"></script>
  <script src="/js/avatar-edit.js"></script>
  <script src="/js/report.js"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/mine.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/pwa.js"></script>
</body>
