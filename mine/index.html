<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>我的 · 跬步</title>
  <meta name="description" content="跬步「我的」：头像与昵称、登录状态与本机层级、本机背诵进度概览，以及注销账号。设置整页在小齿轮后面。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>

<body data-nav="mine" data-page="我的" data-sub="头像 · 昵称 · 账号 · 本机数据" data-top-action="settings">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="mine-page">

      <section class="account-card">
        <div class="identity-row" id="identity-row"></div>
        <p class="account-hint" id="identity-hint"></p>

        <div class="settings-item">
          <label for="input-nickname">昵称</label>
          <div class="name-row">
            <input id="input-nickname" class="settings-input" type="text" maxlength="12"
                   placeholder="Ashley" autocomplete="off" enterkeyhint="done" />
          </div>
        </div>

        <div class="avatar-row" id="avatar-row">
          <span id="avatar-slot" class="avatar-slot" aria-hidden="true"></span>
          <div class="avatar-acts">
            <button class="btn ghost-btn" id="btn-avatar-pick" type="button">上传图片</button>
            <button class="btn ghost-btn" id="btn-avatar-clear" type="button" hidden>删除头像</button>
          </div>
        </div>

        <input id="avatar-file" class="sr-only" type="file" accept="image/*"
               aria-label="选择头像图片" />
        <div class="settings-hint" id="avatar-hint"></div>

        <div class="crop-layer" id="crop-layer" hidden>
          <div class="crop-card" role="dialog" aria-modal="true" aria-label="裁切头像">
            <div class="crop-box" id="crop-box">
              <img class="crop-img" id="crop-img" alt="" />
              <span class="crop-grid" aria-hidden="true"></span>
            </div>
            <input class="crop-zoom" id="crop-zoom" type="range" min="0" max="1"
                   step="0.01" value="0" aria-label="放大缩小" />
            <div class="crop-btns">
              <button class="btn ghost-btn" id="btn-crop-cancel" type="button">取消</button>
              <button class="btn" id="btn-crop-ok" type="button">用这张</button>
            </div>
            <p class="crop-hint" id="crop-hint">拖动图片调整位置，双指或滑杆缩放</p>
          </div>
        </div>

        <div class="account-actions" id="identity-actions">
          <button class="account-btn" id="btn-account-entry" type="button"></button>
          <button class="account-btn ghost" id="btn-sign-out" type="button" hidden>退出登录</button>
          <button class="account-btn ghost" id="btn-go-plans" type="button">权限对比</button>
        </div>

        <p class="account-hint" id="signout-hint" hidden>退出不删进度；注销在下面「危险区」。</p>
      </section>

      <section class="account-card" id="stats-card">
        <h2 class="account-card-title">本机数据</h2>
        <div class="kv-list" id="stats-list"></div>
      </section>

      <section class="account-card" id="family-item">
        <h2 class="account-card-title">子用户</h2>
        <div class="family-panel" id="family-panel"></div>
        <p class="settings-hint" id="family-hint"></p>
      </section>

      <section class="account-card" id="account-card">
        <div class="kv-list" id="account-list"></div>

        <div id="verify-row" hidden>
          <p class="account-msg" id="verify-state"></p>
          <div class="settings-btns">
            <button class="account-btn ghost" id="btn-resend-verify" type="button">重发确认邮件</button>
          </div>
        </div>

        <div class="settings-btns">
          <button class="account-btn ghost" id="btn-go-admin" type="button" hidden>管理后台</button>
        </div>
      </section>

      <section class="account-card danger-zone" id="danger-card">
        <h2 class="account-card-title danger-title">注销账号</h2>
        <p class="account-lead">
          注销会删掉账号与服务器上的云端进度（云端那份先导给你留档），<strong>不动本机背诵进度</strong>。想连本机一起清，去「设置 · 通用」。
        </p>
        <div id="delete-step-1">
          <button class="account-btn danger" id="btn-delete-start" type="button">我要注销账号</button>
        </div>
        <div id="delete-step-2" hidden>
          <div class="account-field">
            <label class="account-label" for="input-delete-email">再输一次注册时用的完整邮箱以确认</label>
            <input id="input-delete-email" class="account-input" type="email" inputmode="email"
                   autocomplete="off" spellcheck="false" placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="confirm-row">
            <button class="account-btn danger" id="btn-delete-confirm" type="button">确认注销</button>
            <button class="account-btn ghost" id="btn-delete-cancel" type="button">取消</button>
          </div>
          <p class="account-msg" id="msg-delete"></p>

          <div id="delete-export" hidden>
            <button class="account-btn ghost" id="btn-delete-export" type="button">下载云端那一份</button>
            <p class="account-hint">注销时从服务器导出，存好它 —— 服务器上已经没有了。</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>

  <script src="/js/account-api.js"></script>

  <script src="/js/family.js"></script>
  <script src="/js/family-ui.js"></script>
  <script src="/js/progress-store.js"></script>

  <script src="/js/sync-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/scheduler.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/index.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/avatar-image.js"></script>
  <script src="/js/avatar-edit.js"></script>
  <script src="/js/mine.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
