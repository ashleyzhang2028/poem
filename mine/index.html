<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>我的 · 跬步</title>
  <meta name="description" content="跬步「我的」：头像与昵称、子用户、登录状态与本机层级、本机背诵进度概览、跨设备同步开关、法务入口，以及注销账号。设置整页在小齿轮后面。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>

<body data-nav="mine" data-page="我的" data-sub="头像 · 昵称 · 账号 · 本机数据" data-top-action="settings">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="mine-page">
      <section class="account-card">
        <!-- ⚠️ 头像 / 昵称 / 层级徽章 / 账号动作**同行**（用户 2026-09-24，Issue #276：
             「要不要登录，上传头像，和删除头像在一行显示？」）。
             所以这三格的次序由 js/mine.js 一处画出来：
               头像槽 · 昵称 + 身份 · 层级徽章 ·「登录/账号」「上传头像」「删除头像」
             这一行**不许换行**（css/account.css 的 .identity-row 那条 nowrap），
             手机上宁可昵称列让位，也不折回「一行一个按钮」那个样子。
             屏幕次序：头像 · 昵称 · 徽章 ·「登录 / 账号」·「上传头像」·「删除头像」。
             「退出登录」不进这一行 —— 它留在下面「账号」卡里跟这一份账号在一起
             （CSS 那条 :has() 把它 display: none 掉；不摘的话实测 360px 上
             这一行会跑出 14px 的横向滚动）。 -->
        <div class="identity-row" id="identity-row"></div>

        <input id="avatar-file" class="sr-only" type="file" accept="image/*"
               aria-label="选择头像图片" />

        <div class="crop-layer" id="crop-layer" hidden>
          <div class="crop-card" role="dialog" aria-modal="true" aria-label="裁切头像">
            <div class="crop-box" id="crop-box">
              <img class="crop-img" id="crop-img" alt="" />
              <span class="crop-grid" aria-hidden="true"></span>
            </div>
            <input class="crop-zoom" id="crop-zoom" type="range" min="0" max="1"
                   step="0.01" value="0" aria-label="放大缩小" />
            <div class="crop-btns">
              <button class="btn ghost-btn" id="btn-crop-cancel" type="button">取消</button>
              <!-- ⚠️ 「删除头像」这颗键住在**裁切层**里（Issue #276 第八轮）。
                   它原先在身份行上、与「上传头像」并排，而那颗键在**没图时
                   也画着**（只是 hidden）—— 判据就是「本机有没有图」，
                   要两处维护（身份行那一半 + 编辑层那一半）。
                   用户 2026-09-24 的原话是：「如果用户没有上传头像，
                   是不是不应该显示删除头像按钮？」—— 那么它只该在
                   **有图**这一半里出现，而有图那一半的唯一入口就是这里
                   （「上传头像」在有图时叫「更新头像」，点进来就是这个层）。
                   这么并之后「删除」不再占身份行一格，也不会再被折到第二行。 -->
              <button class="btn ghost-btn" id="btn-crop-clear" type="button">删除头像</button>
              <button class="btn" id="btn-crop-ok" type="button">用这张</button>
            </div>
          </div>
        </div>

      </section>

      <section class="account-card" id="family-item">
        <h2 class="account-card-title">子用户</h2>
        <div class="family-panel" id="family-panel"></div>
        <p class="settings-hint" id="family-hint"></p>
      </section>

      <section class="account-card" id="stats-card">
        <h2 class="account-card-title">本机数据</h2>
        <div class="kv-list" id="stats-list"></div>
        <!-- 去进度页那一行：它是「去别处看」，不是「清空 / 导出」那类动作，
             所以是一行天青副色的字（无下划线），不是一颗键。
             用户 2026-09-18：文案改「背诵进度」、按钮改成链接。 -->
        <p class="settings-link-row">
          <a class="account-link" id="link-progress" href="/progress/">背诵进度</a>
        </p>
      </section>

      <section class="account-card" id="account-card">
        <h2 class="account-card-title">账号</h2>
        <div class="kv-list" id="account-list"></div>

        <div id="verify-row" hidden>
          <p class="account-msg" id="verify-state"></p>
          <div class="settings-btns">
            <button class="account-btn ghost" id="btn-resend-verify" type="button">重发确认邮件</button>
          </div>
        </div>

        <!-- ⚠️ 这一格原先装着「登录 + 退出登录」两颗键，并整只搬进身份行
             （Issue #276 第七轮靠 CSS 的 order + :has() 在两态间换位置）。
             第八轮把它们收成**身份行上那一颗键的两个文案**（见 js/mine.js 的
             renderSignOut），这里改成账号自己的入口：「账号」去哪儿看
             「我是谁」是 /login/ 那一页的事，与上面「登录 / 退出」那颗
             不是同一件事，所以它在**卡里**，不在身份行上。 -->
        <div class="account-actions" id="account-card-actions">
          <button class="account-btn ghost" id="btn-account-open" type="button">账号与安全</button>
        </div>

      </section>

      <section class="account-card" id="about-card">
        <h2 class="account-card-title">关于</h2>
        <!-- 法务两条在这儿，层级对比 / 自检 / 我的报告在「设置 · 关于」那一处 ——
             同一件事只在**一处**给入口，用户不用记住「哪个入口在哪个页」。
             ⚠️ Issue #244 把个人中心那张卡的层级对比一起搬了过来，本行不重复收它。 -->
        <div class="kv-list">
          <div class="kv-row"><span class="kv-k"><a class="kv-link" href="/terms/">用户协议</a></span><span class="kv-v"></span></div>
          <div class="kv-row"><span class="kv-k"><a class="kv-link" href="/privacy/">隐私条款</a></span><span class="kv-v"></span></div>
        </div>

        <label class="switch sync-row" id="sync-row">
          <span class="settings-label" id="sync-name">跨设备同步</span>
          <input id="toggle-sync" class="switch-input" type="checkbox"
                 role="switch" aria-labelledby="sync-name" />
          <span class="switch-toggle" aria-hidden="true"></span>
        </label>
        <p class="switch-hint" id="sync-hint"></p>

        <div id="sync-conflict" hidden>
          <p class="account-hint" id="conflict-lead"></p>
          <div class="settings-btns">
            <button class="account-btn" id="btn-keep-local" type="button">保留本机</button>
            <button class="account-btn ghost" id="btn-keep-remote" type="button">保留账号</button>
            <button class="account-btn ghost" id="btn-export-first" type="button">先导出再决定</button>
          </div>
          <p class="account-msg" id="msg-conflict"></p>
        </div>

        <div class="account-actions">
          <button class="account-btn ghost" id="btn-go-admin" type="button" hidden>管理后台</button>
        </div>
      </section>

      <section class="account-card danger-zone" id="danger-card">
        <h2 class="account-card-title danger-title">注销账号</h2>
        <p class="account-lead">
          注销会删掉账号与服务器上的云端进度（云端那份先导给你留档），<strong>不动本机背诵进度</strong>。想连本机一起清：<a class="kv-link" href="/settings/general/">清空进度</a>。
        </p>
        <div id="delete-step-1">
          <button class="account-btn danger" id="btn-delete-start" type="button">我要注销账号</button>
        </div>
        <div id="delete-step-2" hidden>
          <div class="account-field">
            <label class="account-label" for="input-delete-email">再输一次注册时用的完整邮箱以确认</label>
            <input id="input-delete-email" class="account-input" type="email" inputmode="email"
                   autocomplete="off" spellcheck="false" placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="confirm-row">
            <button class="account-btn danger" id="btn-delete-confirm" type="button">确认注销</button>
            <button class="account-btn ghost" id="btn-delete-cancel" type="button">取消</button>
          </div>
          <p class="account-msg" id="msg-delete"></p>

          <div id="delete-export" hidden>
            <button class="account-btn ghost" id="btn-delete-export" type="button">下载云端那一份</button>
            <p class="account-hint">注销时从服务器导出，存好它 —— 服务器上已经没有了。</p>
          </div>
        </div>
      </section>

    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>

  <script src="/js/account-api.js"></script>

  <script src="/js/family.js"></script>
  <script src="/js/family-ui.js"></script>
  <script src="/js/progress-store.js"></script>

  <script src="js/read-sync.js"></script>
  <script src="js/sync-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/scheduler.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/text-master.js"></script>
  <script src="/data/index.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/avatar-image.js"></script>
  <script src="/js/avatar-edit.js"></script>
  <script src="/js/mine.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
