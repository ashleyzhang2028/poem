<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>个人中心 · 跬步</title>
  <meta name="description" content="跬步个人中心：昵称与头像印记、本机账号与订阅层级、权限清单、本机数据概览，以及退出登录与注销账号。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>

<body data-nav="profile" data-dock="off" data-back="/mine/" data-page="个人中心" data-sub="昵称 · 账号 · 权限">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="profile-page">

      <section class="account-card">
        <div class="identity-row" id="identity-row"></div>
        <p class="account-hint" id="identity-hint"></p>

        <div class="account-actions" id="identity-actions">
          <button class="account-btn" id="btn-account-entry" type="button"></button>
          <button class="account-btn ghost" id="btn-sign-out" type="button" hidden>退出登录</button>
          <button class="account-btn ghost" id="btn-go-plans" type="button">权限对比</button>
        </div>

        <p class="account-hint" id="signout-hint" hidden>退出不删进度；注销在下面「危险区」。</p>
      </section>

      <section class="account-card" id="stats-card">
        <h2 class="account-card-title">本机数据</h2>
        <div class="kv-list" id="stats-list"></div>
      </section>

      <section class="account-card">
        <h2 class="account-card-title">关于</h2>
        <div class="kv-list">
          <div class="kv-row"><span class="kv-k">应用</span><span class="kv-v">跬步 · 古诗词背诵</span></div>
          <div class="kv-row"><span class="kv-k">用户协议</span><span class="kv-v"><a href="/terms/">查看</a></span></div>
          <div class="kv-row"><span class="kv-k">隐私条款</span><span class="kv-v"><a href="/privacy/">查看</a></span></div>
          <div class="kv-row"><span class="kv-k">离线缓存</span><span class="kv-v" id="about-cache"></span></div>
        </div>

        <label class="switch sync-row" id="sync-row">
          <span class="settings-label" id="sync-name">跨设备同步</span>

          <input id="toggle-sync" class="switch-input" type="checkbox"
                 role="switch" aria-labelledby="sync-name" />
          <span class="switch-toggle" aria-hidden="true"></span>
        </label>
        <p class="switch-hint" id="sync-hint"></p>

        <div id="sync-conflict" hidden>
          <p class="account-hint" id="conflict-lead"></p>
          <div class="settings-btns">
            <button class="account-btn" id="btn-keep-local" type="button">保留本机</button>
            <button class="account-btn ghost" id="btn-keep-remote" type="button">保留账号</button>
            <button class="account-btn ghost" id="btn-export-first" type="button">先导出再决定</button>
          </div>
          <p class="account-msg" id="msg-conflict"></p>
        </div>
        <div class="account-actions">
          <button class="account-btn ghost" id="btn-go-admin" type="button" hidden>管理后台</button>
        </div>

        <div class="kv-list" id="account-list" hidden></div>

        <div id="verify-row" hidden>
          <p class="account-msg" id="verify-state"></p>
          <div class="settings-btns">
            <button class="account-btn ghost" id="btn-resend-verify" type="button">重发确认邮件</button>
          </div>
        </div>
      </section>

      <section class="account-card danger-zone" id="danger-card" hidden>
        <h2 class="account-card-title danger-title">注销账号</h2>
        <p class="account-lead">
          注销会删掉账号与服务器上的云端进度（云端那份先导给你留档），<strong>不动本机背诵进度</strong>。想连本机一起清，去「设置 · 通用」。
        </p>
        <div id="delete-step-1">
          <button class="account-btn danger" id="btn-delete-start" type="button">我要注销账号</button>
        </div>
        <div id="delete-step-2" hidden>
          <div class="account-field">
            <label class="account-label" for="input-delete-email">再输一次注册时用的完整邮箱以确认</label>
            <input id="input-delete-email" class="account-input" type="email" inputmode="email"
                   autocomplete="off" spellcheck="false" placeholder="you@example.com" maxlength="120" />
          </div>
          <div class="confirm-row">
            <button class="account-btn danger" id="btn-delete-confirm" type="button">确认注销</button>
            <button class="account-btn ghost" id="btn-delete-cancel" type="button">取消</button>
          </div>
          <p class="account-msg" id="msg-delete"></p>

          <div id="delete-export" hidden>
            <button class="account-btn ghost" id="btn-delete-export" type="button">下载云端那一份</button>
            <p class="account-hint">注销时从服务器导出，存好它 —— 服务器上已经没有了。</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>

  <script src="/js/account-api.js"></script>

  <script src="/js/family.js"></script>
  <script src="/js/progress-store.js"></script>

  <script src="/js/sync-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/scheduler.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/index.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
