<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>层级对比 · 跬步</title>
  <meta name="description" content="跬步层级对比：游客、Free、Pro、Max 四种身份能用的功能逐条对照，打钩打叉一眼看清。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="robots" content="noindex, follow" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<!-- data-dock="off"：对比页是「看明白一件事」的一页，看完就走，
     不留底部页签免得误触跳走（法务页同款）。返回落点回个人中心 ——
     用户是从 /profile/ 的「权限」那一节点进来的。 -->
<body data-nav="plans" data-dock="off" data-back="/profile/" data-page="层级对比" data-sub="游客 · Free · Pro · Max">
  <div class="app">
    <header class="topbar"></header>

    <main class="account-page" id="plans-page">
      <!-- ==================================================================
           层级对比（Issue #132）
           ------------------------------------------------------------------
           用户提的：「像其他网站那样，最左边是对比项，右边几列是不同角色，
           下面用打钩打叉」。

           ⚠️ 这张表**不是手抄的**：每一格都是当场问 `Entitlement.can()` 得来的
              （见 js/plans.js 与 entitlement.js 的 compare()）。手抄一份的下场是
              内核改了门槛、这张表还是老话 —— 而这张表恰恰是用户唯一会逐条看的页面。
           ⚠️ 格子里的**数字**（10 个 / 100 个 / 5000 个、261 首、子用户 1 / 3 / 180）
              同理：它们长在 CAPS 的 `quotas` 上，是 `js/collections.js` 与
              `js/family.js` 的 `limit()` 读的那个数 —— 表上写 100 个、实际能建
              别的数，这张表就成了假话（用户 2026-09-18 Issue #163 点名的那条）。

           ⚠️ 本期三层是**本机登记**的演示版：手改存储就能给自己升级，
              所以这张表的表尾必须如实写明它不是付费凭据（不许装作在卖东西）。
           ================================================================== -->

      <!-- ---------- 一、四列对比（这一页就只有这张表） ----------
           Issue #163：原先顶上还挂一张「免费版不缩水：全部篇目、每日排程、注音、
           进度导出一件不少。Pro / Max 只加能力」的卡 —— 那是把表**第一组**
           又说了一遍（灰字已经写着「免费且不缩水」），删掉。
           下面是这张表本身唯一还需要的一句图例（符号各是什么）。 -->
      <section class="account-card">
        <div class="plans-scroll">
          <table class="plans-table">
            <caption class="plans-caption">各身份可用功能对照</caption>
            <thead id="plans-head"></thead>
            <tbody id="plans-body"></tbody>
            <tfoot id="plans-foot"></tfoot>
          </table>
        </div>
        <p class="account-hint">
          <span class="plans-mark ok" aria-hidden="true">✓</span> 可用 ·
          <span class="plans-mark no" aria-hidden="true">✕</span> 不可用
        </p>
      </section>

      <!-- ---------- 二、这些层级是什么（Issue #209：上面那张表已经答完「我在哪一格」） ----------
           ⚠️ 这一页原先有三样东西回答「你现在是什么身份」：
                ① 上面那张对比表四个列头的角标「你现在在这」
                ② 「现在」这张卡的三行（身份 / 层级 / 落在哪一列）
                ③ 卡底下一句「未登录，只差这一条：登录可用」
              用户 2026-09-17 原话：「现在 身份 游客（本机） 层级 Free 落在哪一列
              游客 层级本机登记，改一行存储就能改。 未登录，只差这一条：登录可用
              …… 上面这张卡片没有任何存在的意义，删除」——
              ①②③ 说的是同一件事，① 已经在列头上把「你在哪一格」指出来了，
              ②③ 是同一句话再说一遍。于是「现在」这张卡整张撤掉（不是只删按钮），
              只留「关于这些层级」那一句 —— 它是这一页唯一别处没说过的事实：
              层级**是谁定的**。
              ⚠️ 判据仍走 js/plans.js 的 renderAbout()（`id.tierSource` 分叉），
                 HTML 里不写死一句话（写死的那句在服务端接通之后就是假话，见 2.1）。 -->
      <section class="account-card">
        <p class="account-hint" id="plans-about"></p>
      </section>
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 脚本顺序：auth-core → entitlement → auth-api → account-api → avatar → 本页 → chrome → pwa
       avatar.js 必须在 chrome.js 之前：顶栏右侧那一枚印由 chrome.js 渲染时才读它
       account-api.js 必须排在 entitlement.js 之后（要先把权益层装上，它才写得进去）；
       本页要它是因为「关于这些层级」那一段得如实说清层级**是谁定的**（2.1） -->
  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/plans.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
