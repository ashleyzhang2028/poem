<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>我的清单 · 跬步</title>
  <meta name="description" content="跬步设置 · 我的清单：自选背诵的导入、导出、改名、删除、整组移出与顺序调整。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />
  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 清单卡片与「课外阅读」入口页那六张卡（.library-card）是同一套设计
       （Issue #163 用户要求两者保持一致），所以那一套样式要能取到。
       ⚠️ 只搬样式，不搬 js/library.js —— 那一页的卡片由它自己的数据渲染，
          这一页的清单仍是 js/settings.js 按集合数据画。 -->
  <link rel="stylesheet" href="css/classic.css" />
</head>
<body data-nav="settings" data-back="/settings/" data-page="我的清单" data-sub="自选背诵的增删改查">
  <div class="app">
    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">
      <!-- ==================================================================
           设置 · 我的清单（二级页）
           ------------------------------------------------------------------
           自选背诵（除教材之外，自己额外想背的篇目）。
           这一整块原先长在**首页**底部，Issue #114 第二条：
           「自选背诵栏应该全部放到设置中去，首页背诵栏只显示背诵列表，
             不要干扰背诵。所有导入、导出、重命名、删除等等应该全部在设置中进行。」
           二级页之前它已是设置页里的一组，现在单独占一页 ——
           因为它是唯一一块「面板 + 一排管理键」的组，混在别的组里最容易误触。

           ⚠️ 搬的是**管理入口**，不是这些篇目的背诵 ——
              自选篇目本来就跟课内 261 首一起按遗忘曲线排每日任务。
           ⚠️ 与首页读同一份 localStorage 键 poem_recite_collections_v1：
              这一页改完，回首页的今日任务立刻跟着变。
           ================================================================== -->
      <div class="settings-groups">
        <section class="settings-group">

          <!-- ⚠️ .wide：这一项在平板两列排布里**跨列**（见 css/style.css 的
               .settings-item.wide）—— 清单面板自己不常满，但拖拽排序与
               「导入 / 导出」两排按钮挤在半栏里会折成三四行。 -->
          <div class="settings-item wide">
            <label>自选背诵</label>
            <div class="collections-panel" id="collections-panel">
              <p class="collections-tip" id="collections-tip" hidden></p>
              <div class="collections-tools" id="collections-tools">
                <button type="button" class="collection-act" id="btn-collections-import" title="粘贴一份清单，新建一个集合">导入清单</button>
              </div>
              <!-- 清单：**一张集合一张卡**，样式与「课外阅读」入口页那六张卡
                   （.library-card）同一套 —— 卡片描边 + 圆角，篇与篇之间用
                   同色的一条细线隔开，卡内不再各带纸底、也不再画竖色条。
                   Issue #163 用户原话：「我的清单卡片设计最好和 课外阅读 页面的
                   卡片设计保持一致，里面没有绿色竖线，横着的项目用边框颜色
                   一样的线隔开。」
                   ⚠️ 集子那一段的 DOM 仍由 js/settings.js 按同一份数据画，
                      容器由 .collections-panel 换成 .library-grid（单列）。 -->
              <div class="library-grid" id="collections-list"></div>
            </div>
          </div>
        </section>

        <!-- ==================================================================
             篇目打印页（Pro · export.paper）
             ------------------------------------------------------------------
             入口**就在自选清单下面**，因为要打印的正是这份清单：
             挑了几十篇、排好顺序，下一步就是「打出来贴墙上」。

             ⚠️ 与古诗词大会同一条路子：**就地叠层**，地址栏不动，
                返回键一层退一层。这一件事没有自己的状态 ——
                它用的就是「哪一份清单」，单开一页等于让人来回搬东西。

             ⚠️ 未登录 / 层级不够时这颗键**照旧看得见**（不许把入口藏起来
                当成权限边界，docs §3.4），点进去是一张如实说明「要 Pro」的卡。

             ⚠️ 这一块的说明只说「能做什么」，**不写「即将上线」** ——
                它就是做完了，只是要 Pro（2A 立的规矩）。
             注意 `data-print-collection` 留空 = **全部自选**（按作品去重，
             与每日任务同一份口径）；某一本清单的「打印」在那一行的操作键里。
             ================================================================== -->
        <section class="settings-group" aria-labelledby="grp-print">
          <h2 class="settings-group-title" id="grp-print">打印</h2>
          <div class="settings-item wide">
            <div class="settings-btns">
              <button class="btn ghost-btn" type="button" data-print-open="1"
                title="把这份清单排成一页纸，打印或存成 PDF">打印清单</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 篇目打印页那一层：就地铺在同一个 .app 里（与 /poems/ 的古诗词大会同一条规矩）。
           默认 hidden，点上面那颗键才铺上来。 -->
      <div class="poems-print" data-print-view="sheet" hidden></div>
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <!-- 导入 / 导出清单的纯文本对话框：与首页那一枚同一套 .modal（同一份 CSS、同一个层级），
       所以不会被底部页签压住 -->
  <div class="modal text-modal" id="text-dialog" hidden>
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="text-dialog-title">
      <button class="modal-close" data-close="1" aria-label="关闭">✕</button>
      <div class="modal-head">
        <h2 id="text-dialog-title"></h2>
      </div>
      <p class="text-dialog-tip" id="text-dialog-tip"></p>
      <textarea id="text-dialog-text" spellcheck="false" aria-label="清单文本"></textarea>
      <div class="actions">
        <button type="button" class="btn" id="text-dialog-cancel">关闭</button>
        <button type="button" class="btn good primary-btn" id="text-dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="file-import" accept="application/json" hidden />

  <script src="/data/text-master.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/index.js"></script>
  <script src="/data/site-index.js"></script>

  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <!-- 分域引擎（Issue #132 阶段 0）：进度 / 账号 / 设备三域的唯一一份定义，
       设置页的读法由 js/storage.js 转发。**必须排在 js/storage.js 之前**。 -->
  <script src="/js/family.js"></script>
  <script src="/js/progress-store.js"></script>
  <!-- 同步层（Issue #132 · 1B）：进度 / 账号域设置 / 已读的跨设备同步。
       必须在 js/storage.js 之前 —— 它的 touch() 要给每条记录打标，
       而页面只认识 Storage/ProgressStore 这两个入口。 -->
  <script src="/js/sync-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/scheduler.js"></script>
  <script src="/js/manifest-loader.js"></script>
  <script src="/js/play-modes.js"></script>
  <script src="/js/review-models.js"></script>
  <!-- 自选集合（用户自己加背的篇目）：本页就是它的增删改查。
       与首页、集子页读的是同一个模块、同一份 localStorage 键。 -->
  <script src="/js/collections.js"></script>
  <!-- 篇目打印页的版面内核（纯逻辑、零 DOM、零网络）：页数**算得出来**，
       且只有这一份参数（css/account.css 的打印那一段读的是同一份口径）。 -->
  <script src="/js/print-core.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/print.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
