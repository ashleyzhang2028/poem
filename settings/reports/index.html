<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>我的报告 · 跬步</title>
  <meta name="description" content="跬步设置 · 我的报告：报过的问题处理到哪一步。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />
  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />
</head>
<body data-nav="settings" data-back="/settings/" data-page="我的报告" data-sub="报过的问题处理到哪一步">
  <div class="app">
    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">

      <div class="settings-groups">
        <section class="settings-group">
          <div class="settings-item wide">
            <label>我报过的</label>

            <p class="account-hint" id="reports-guest" hidden>
              <a class="report-login-link" href="/login/">登录</a>后才能报告。
            </p>

            <div class="settings-btns" style="margin-bottom:10px">
              <button class="btn ghost-btn" type="button" id="btn-reports-refresh">刷新</button>
              <button class="btn ghost-btn" type="button" id="btn-reports-send" hidden>重发</button>
            </div>

            <p class="account-hint" id="reports-send-hint" hidden></p>

            <div id="reports-panel">
              <p class="account-hint">正在读取……</p>
            </div>

            <p class="account-msg" id="msg-reports"></p>
          </div>
        </section>
      </div>
    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/report.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/reports-page.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
