<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>通用 · 跬步</title>
  <meta name="description" content="跬步设置 · 通用：用户名与头像印记、本机账号、数据备份与清空。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />
  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-nav="settings" data-back="/settings/" data-page="通用" data-sub="用户名与头像印记、账号、数据备份">
  <div class="app">
    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">
      <!-- ==================================================================
           设置 · 通用（二级页）
           ------------------------------------------------------------------
           这一组是「全站都吃」的身份与数据设置：
             · 用户名      账号域的展示名（古诗词与小古文共用）
             · 头像印记    字符印：固定字集 + 固定四色，全部存本机
             · 子档案      一个家长多个孩子各背各的（进度 / 年级 / 已读分家）
             · 账号        本机账号的登录状态 / 层级 / 权限，可退出
             · 数据管理    导出备份 / 导入备份 / 清空进度
           ⚠️ 与本页无关的控件（学段 / 范围 / 算法 / 连读 / 清单）在别页，
              但都跑同一份 js/settings.js —— 它取不到某个 id 就跳过那一段。
           ================================================================== -->
      <div class="settings-groups">
        <section class="settings-group">

          <div class="settings-item">
            <label for="input-username">用户名</label>
            <div class="name-row">
              <!-- 账号域那枚「印」：与顶栏右上角、首页那一枚同一份数据（poem_profile_v1）。
                   印由 js/avatar.js 画，其他文件不许自己拼一份渐变（有源码扫描守着）。 -->
              <span id="avatar-slot" class="avatar-slot" aria-hidden="true"></span>
              <input id="input-username" class="settings-input" type="text" maxlength="12"
                     placeholder="Ashley" autocomplete="off" enterkeyhint="done" />
            </div>
            <div class="settings-hint">留空显示「Ashley」；全站共用</div>
          </div>

          <div class="settings-item">
            <label>头像印记</label>
            <!-- 字符印：从**固定的字集**里挑一个字 + 固定四色。
                 不弹文件选择框、不上传任何图片 —— 所以 /privacy/ 的「不收集」承诺仍然成立。
                 见 docs/auth-design.md §2.3。 -->
            <div class="seal-picker">
              <div class="seal-chars" id="seal-chars" role="group" aria-label="选一个字"></div>
              <div class="seal-inks" id="seal-inks" role="group" aria-label="选一个印色"></div>
              <button class="btn ghost-btn" id="btn-seal-reset" type="button">用默认印</button>
            </div>
            <div class="settings-hint" id="seal-hint"></div>
          </div>

          <div class="settings-item" id="family-item">
            <!-- 家庭子档案（3 期 P1 · profile.family）：一个家长多个小孩，
                 每个孩子各背各的。孩子**不建独立账号**（只是账号下的一个展示名），
                 所以这里既没有「邀请」也没有「孩子登录」——只有一份名册 + 一个切换。

                 ⚠️ 切换是**账号域**的事：换孩子 = 换一套进度 / 年级 / 已读
                    （同一台平板上字号不会跟着变，那是设备域，见 js/family.js）。
                 ⚠️ 名册为空时**不画**这一块（而不是画一个空框）：老用户升级后
                    第一次进这一页，认领会把它变成「子档案 1」，界面上不出现
                    一个「一个孩子都没有」的中间态。 -->
            <label>子档案</label>
            <div class="family-panel" id="family-panel"></div>
            <p class="settings-hint" id="family-hint"></p>
          </div>

          <div class="settings-item">
            <label>账号</label>
            <!-- 本机账号（/privacy/ 口径：只存在本机，不上传、不云同步）。
                 层级徽章与权限清单读 js/entitlement.js，本页不自己拼 plan。 -->
            <div class="account-panel" id="account-panel"></div>
          </div>

          <div class="settings-item">
            <!-- 跨设备同步：一行「左标签 · 右开关」，说明文字在开关下面一行。

                 结构是**手机系统开关**那一路（Issue #163 第三轮）：
                   · <input class=switch-input>  真实复选框 —— 键盘 / 读屏 / 原生 toggle 都走它，
                                                画成 0 尺寸（不占位），只当状态与焦点用
                   · <span class=switch-toggle>  可见的那颗轨道 + 滑块（滑块是它的 ::after）

                 ⚠️ 滑块画在**轨道内部**（.switch-toggle 是 position:relative 的包含块）。
                    上一版滑块是可以出现在 DOM 任何位置的 <span class=switch-track>，
                    靠 absolute 定位去叠 —— 而它一路上没有非 static 祖先，于是以**文档**
                    为坐标落在页面左上角（实测在屏幕外），用户看到的是一颗空药丸。
                    现在轨道与滑块是同一个元素的「盒子 + ::after」，画不到一起去都难。
                 ⚠️ 顺序不能反：CSS 用 `input:checked + .switch-toggle` 找轨道。
                 ⚠️ 开关**出厂关着**（用户裁决：默认本地，docs §4.2 第 2 条）。
                    关掉即完全退回 0 期行为：不发一个请求、不留一处云端痕迹。
                 ⚠️ 它管的是「要不要把进度上传」—— 与「有没有登录」是两件事：
                    没登录的人这一项按 signin 说明，不是按 off。
                 ⚠️ **跨设备云同步是 Pro 起**（能力表 `sync.multiDevice`）。
                    闸在 `js/sync-store.js` 的 `gate()`（界面这一层）**与**
                    `/api/sync/push` / `/api/sync/pull` 的 `E_TIER`（真正的边界）两处。
                    开关**不置灰**：点下去得到一句「要 Pro 起可用」，
                    比一个点不动的东西更容易看懂差在哪。
                 ⚠️ 标签是显式的 <span>，不用 <label for>：整行已由外层 <label> 包着，
                    再套一层 for 会让「点一下文字」触发两次 toggle 又立刻翻回去。 -->
            <label class="switch">
              <span class="settings-label" id="switch-sync-name">跨设备同步</span>
              <input id="toggle-sync" class="switch-input" type="checkbox"
                     role="switch" aria-labelledby="switch-sync-name" />
              <span class="switch-toggle" aria-hidden="true"></span>
            </label>
            <p class="switch-hint" id="sync-hint"></p>
          </div>

          <div class="settings-item">
            <label>数据管理</label>
            <div class="settings-btns">
              <button class="btn ghost-btn" id="btn-export">导出备份</button>
              <button class="btn ghost-btn" id="btn-import">导入备份</button>
              <button class="btn danger-btn" id="btn-reset">清空进度</button>
            </div>
            <div class="settings-hint">含全部设置与背诵进度</div>
          </div>

          <!-- 课内诗词整体导出（Pro）。
               ⚠️ 这一块的口径被用户改过一次（2026-09-16，Issue #159）：
                  原先能力表上写的是「全站批量导出（Max，含六部集子 1592 篇）」，
                  用户点名不要那种「把站点内容整本拷走」的导出，
                  只保留**学校课本部分**（课内 261 首），且门槛降到 **Pro**。
               ⚠️ 按钮**不隐藏**：层级不够时点它得到的是「Pro 起可用」（与全站
                  同一句 denyReason），把入口藏起来从来不是权限边界（docs §3.4）。
               ⚠️ 拦在**数据层**：范围表只认「课内」这一部（js/export-core.js 的
                  SCOPES），按钮之外直接调用那一层也一样导不出集子。 -->
          <div class="settings-item">
            <label>课内诗词导出</label>
            <div class="settings-btns">
              <button class="btn ghost-btn" id="btn-export-poems">导出课内 261 首</button>
            </div>
            <div class="settings-hint" id="export-poems-hint"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="modal text-modal" id="text-dialog" hidden>
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="text-dialog-title">
      <button class="modal-close" data-close="1" aria-label="关闭">✕</button>
      <div class="modal-head">
        <h2 id="text-dialog-title"></h2>
      </div>
      <p class="text-dialog-tip" id="text-dialog-tip"></p>
      <textarea id="text-dialog-text" spellcheck="false" aria-label="清单文本"></textarea>
      <div class="actions">
        <button type="button" class="btn" id="text-dialog-cancel">关闭</button>
        <button type="button" class="btn good primary-btn" id="text-dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="file-import" accept="application/json" hidden />

  <!-- 这一页只读**站点总索引**，不读五部集子的 4.4MB 语料。
       data/text-master.js 必须排在 data/index.js 之前（课内条目只存 textRef）。 -->
  <script src="/data/text-master.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/index.js"></script>
  <script src="/data/site-index.js"></script>

  <!-- 账号与权益：设置页的「账号」一项由它们出判据（顺序与全站一致） -->
  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>
  <!-- 账号接线层（Issue #132 · 2 期「补洞」）：/api/me 的下发只在它里面接一次。
       本页据此把「当前层级」标成「服务器判定」或「本机登记」——
       不标出来的话，本机登记那份会被读成权威判定（docs §3.4）。 -->
  <script src="/js/account-api.js"></script>
  <!-- 分域引擎（Issue #132 阶段 0）：进度 / 账号 / 设备三域的唯一一份定义，
       设置页的读法由 js/storage.js 转发。**必须排在 js/storage.js 之前**。 -->
  <!-- 家庭子档案（3 期 P1）：**必须排在 progress-store 之前** ——
       引擎按当前孩子拼键名（js/family.js 是唯一的拼接处），
       顺序反了不会报错，只是永远读「没有后缀」那把老键，症状是「切换孩子后进度为空」。 -->
  <script src="/js/family.js"></script>
  <script src="/js/progress-store.js"></script>
  <!-- 同步层（Issue #132 · 1B）：进度 / 账号域设置 / 已读的跨设备同步。
       必须在 js/storage.js 之前 —— 它要给每条记录打标（云端谁更新），
       而页面只认识 Storage / ProgressStore 这两个入口。 -->
  <script src="/js/sync-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/scheduler.js"></script>
  <!-- 导出内核（纯逻辑，零 DOM）：课内 261 首整份导出成文本。
       它**只认范围表**（SCOPES 里只有「课内」）—— 六部集子不做一次性整本导出，
       是用户 2026-09-16 的裁决（Issue #159），那一条拦在内核里、不拦在按钮上。 -->
  <script src="/js/export-core.js"></script>
  <script src="/js/manifest-loader.js"></script>
  <script src="/js/play-modes.js"></script>
  <script src="/js/review-models.js"></script>
  <script src="/js/collections.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/avatar.js"></script>
  
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
