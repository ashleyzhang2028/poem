<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>通用 · 跬步</title>
  <meta name="description" content="跬步设置 · 通用：本机账号、数据备份与清空。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />
  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-nav="settings" data-back="/settings/" data-page="通用" data-sub="账号 · 数据备份">
  <div class="app">
    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">

      <div class="settings-groups">
        <section class="settings-group">

          <div class="settings-item">
            <label>账号</label>

            <div class="account-panel" id="account-panel"></div>
          </div>

          <div class="settings-item">

            <label class="switch">
              <span class="settings-label" id="switch-sync-name">跨设备同步</span>
              <input id="toggle-sync" class="switch-input" type="checkbox"
                     role="switch" aria-labelledby="switch-sync-name" />
              <span class="switch-toggle" aria-hidden="true"></span>
            </label>
            <p class="switch-hint" id="sync-hint"></p>
          </div>

          <div class="settings-item">
            <label>数据管理</label>
            <div class="settings-btns">
              <button class="btn ghost-btn" id="btn-export">导出备份</button>
              <button class="btn ghost-btn" id="btn-import">导入备份</button>
              <button class="btn danger-btn" id="btn-reset">清空进度</button>
            </div>
                      </div>

          <div class="settings-item">
            <label>课内诗词导出</label>
            <div class="settings-btns">
              <button class="btn ghost-btn" id="btn-export-poems">导出</button>
            </div>
          </div>
        </section>
      </div>
    </main>

  </div>

  <div class="modal text-modal" id="text-dialog" hidden>
    <div class="modal-mask" data-close="1"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="text-dialog-title">
      <button class="modal-close" data-close="1" aria-label="关闭">✕</button>
      <div class="modal-head">
        <h2 id="text-dialog-title"></h2>
      </div>
      <p class="text-dialog-tip" id="text-dialog-tip"></p>
      <textarea id="text-dialog-text" spellcheck="false" aria-label="清单文本"></textarea>
      <div class="actions">
        <button type="button" class="btn" id="text-dialog-cancel">关闭</button>
        <button type="button" class="btn good primary-btn" id="text-dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="file-import" accept="application/json" hidden />

  <script src="/data/text-master.js"></script>
  <script src="/data/poems-1.js"></script>
  <script src="/data/poems-2.js"></script>
  <script src="/data/poems-3.js"></script>
  <script src="/data/poems-4.js"></script>
  <script src="/data/poems-5.js"></script>
  <script src="/data/poems-6.js"></script>
  <script src="/data/poems-7.js"></script>
  <script src="/data/poems-8.js"></script>
  <script src="/data/poems-9.js"></script>
  <script src="/data/poems-10.js"></script>
  <script src="/data/poems-11.js"></script>
  <script src="/data/poems-12.js"></script>
  <script src="/data/index.js"></script>
  <script src="/data/site-index.js"></script>

  <script src="/js/auth-core.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/entitlement.js"></script>

  <script src="/js/account-api.js"></script>

    <script src="/js/progress-store.js"></script>

  <script src="/js/sync-store.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/scheduler.js"></script>

  <script src="/js/export-core.js"></script>
  <script src="/js/manifest-loader.js"></script>
  <script src="/js/play-modes.js"></script>
  <script src="/js/review-models.js"></script>
  <script src="/js/collections.js"></script>
  <script src="/js/settings.js"></script>

  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
