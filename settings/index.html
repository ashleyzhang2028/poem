<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>设置 · 跬步</title>
  <meta name="description" content="跬步设置：用户名与头像印记、数据备份，背诵的学段年级学期与范围数量、复习算法，自选背诵清单的管理，自动注音与连读方式。" />
  <meta name="format-detection" content="telephone=no" />

  <!-- iOS（苹果手机 / iPad）支持 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-nav="settings" data-page="设置" data-sub="通用 · 背诵 · 清单 · 朗读">
  <div class="app">
    <!-- 顶部栏：由 js/chrome.js 统一渲染（全站同一套 logo + 跬步 + 页面名） -->
    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">
      <!-- ==================================================================
           设置主页（Issue #132 后续 · 二级设置页）
           ------------------------------------------------------------------
           一页里已经堆了六组（#114 分组、#132 账号 / 头像 / 算法 / 朗读），
           再往上加只会更长。于是每**一组**摊成一页二级页：
             通用        → /settings/general/
             背诵        → /settings/recite/     （含复习算法）
             我的清单    → /settings/lists/
             朗读        → /settings/reader/     （注音 + 五档连读方式）
           这一页只留四条入口 + 版权与法务链接。

           ⚠️ 入口清单由 js/settings-nav.js 的 GROUPS 生成，**不在 HTML 里
              手写**：加一组只改那一处。所以下面这块容器是空的。
           ⚠️ URL 一律目录化（不带 .html），与 js/chrome.js 的 ROUTES 同一约定。
           ================================================================== -->
      <div class="settings-groups settings-index" id="settings-index"></div>

      <!-- ==================================================================
           账号卡（Issue #132 · A→B→C→D 的 D）
           ------------------------------------------------------------------
           「账号」原本只在设置 · 通用里有一项（未登录显示「用邮箱登录」、
           已登录显示「个人中心」）。问题是它埋了两层深：设置 → 通用 → 账号，
           而设置主页本身就是全站四页签之一 —— 一个未登录的人从首页走两步
           才第一次知道「这里可以建账号」。

           所以这里补一张**自己会收敛的卡**，两个状态各有各的样子：
             · 未登录  → 一颗「用邮箱登录」，落在 /login/（顺手提一句语音朗读
                         登录后免费 —— 那是未登录用户唯一真的用不了的现有功能）
             · 已登录  → 一行身份（印 + 昵称 + 邮箱掩码 + 层级徽章）+ 「个人中心」，
                         与账号三页的其余出口同一条动线
           ⚠️ 已登录时**不摆**「去登录」：那时再摆一次是自相矛盾的
              （「管理登录状态」那一颗在个人中心里，与退出 / 注销放在一起）。
           ⚠️ 本卡由 js/settings-nav.js 画（它是这一页唯一的脚本），
              判据一律走 Entitlement / AuthCore，**不在页面里自己拼 plan / tier**。
           ================================================================== -->
      <div class="settings-groups" id="account-entry" hidden></div>
    </main>

    <!-- 版权 + 用户协议 / 隐私条款：整页设置的最底部（页面内容不足时也贴底） -->
    <footer class="foot settings-foot">
      <span class="foot-copy">&copy;2026 kuibu.app 积跬步, 至千里</span>
      <span class="foot-links">
        <a href="/terms/">用户协议</a>
        <span class="foot-sep">·</span>
        <a href="/privacy/">隐私条款</a>
      </span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- 顶栏 + 页签 + 入口清单。这一页**不加载** js/settings.js ——
       表单控件都搬到各二级页了，主页只为「进哪一页」负责。 -->
  <script src="/js/settings-nav.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
