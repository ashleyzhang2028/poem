<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>设置 · 跬步</title>
  <meta name="description" content="跬步设置：数据备份与课内诗词导出，背诵的学段年级学期与范围数量、复习算法，自选清单的管理，自动注音与连读方式，以及关于与法务。" />
  <meta name="format-detection" content="telephone=no" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />

  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-nav="settings" data-back="/mine/" data-page="设置" data-sub="通用 · 背诵 · 清单 · 朗读 · 关于">
  <div class="app">

    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">

      <div class="settings-groups settings-index" id="settings-index"></div>

      <section class="settings-about" id="settings-about"></section>
    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/entitlement.js"></script>
    <!--
    登录状态（Issue #274）：`js/account-api.js` 是**问服务端「我是谁」**的唯一出口，
    而 `js/chrome.js` 在顶栏就位时会问一次（答完喊 `account:ready`）。
    这两份脚本因此是**每一张有导航的页面**都要有的：缺一张，那一张就永远
    说自己是游客 —— 而用户看到的正是「从首页到设置各页面还是没登录」。
  -->
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/settings-nav.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
