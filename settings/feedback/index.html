<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6055" />
  <title>意见反馈 · 跬步</title>
  <meta name="description" content="跬步：向管理员提交产品需求、功能建议或使用中遇到的问题，管理员回复后可在这里看到。" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="跬步" />
  <meta name="mobile-web-app-capable" content="yes" />
  <base href="/" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/account.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VEFD6BLJV5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-VEFD6BLJV5');
  </script>
</head>
<body data-nav="settings" data-back="/mine/" data-page="意见反馈" data-sub="提需求、报问题，管理员会在这里回复">
  <div class="app">
    <header class="topbar"></header>

    <main class="settings-page" id="settings-page">

      <div class="settings-groups">
        <section class="settings-group">
          <div class="settings-item wide">
            <label>提交新的一条</label>
            <p class="account-hint">没登录也能发：这台设备会记得是你发的，方便你回来看回复、继续跟帖。登录后换设备也能看到。</p>

            <div class="account-field">
              <span class="account-label" id="fb-kinds-label">类型</span>
              <div class="report-kinds" id="fb-kinds" role="group" aria-labelledby="fb-kinds-label"></div>
            </div>
            <div class="account-field">
              <label class="account-label" for="fb-content">内容</label>
              <textarea id="fb-content" class="account-input" rows="3" maxlength="2000"></textarea>
            </div>
            <button class="account-btn" id="btn-fb-send" type="button">发送</button>
            <p class="account-msg" id="msg-feedback"></p>
          </div>
        </section>

        <section class="settings-group">
          <div class="settings-item wide">
            <label>我提交过的</label>
            <div class="settings-btns">
              <button class="btn ghost-btn" type="button" id="btn-fb-refresh">刷新</button>
            </div>
            <ul class="fb-list" id="fb-list"></ul>
            <p class="account-hint" id="fb-empty" hidden>还没有提交过。</p>
          </div>
        </section>
      </div>
    </main>

  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/auth-core.js"></script>
  <script src="/js/entitlement.js"></script>
  <script src="/js/auth-api.js"></script>
  <script src="/js/account-api.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/feedback-page.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
